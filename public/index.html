<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carnival of Monsters – Online</title>
<style>
  :root { font-family: system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%); color: #f1f5f9; padding-bottom: 110px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 1.4rem; text-align: center; margin: 8px 0; }
  .center { text-align: center; }
  .muted { color: #94a3b8; font-size: 0.8rem; }
  .card-panel { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
  .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 8px; }
  button { font-family: inherit; border: none; border-radius: 12px; padding: 10px 16px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  .btn-amber { background: #f59e0b; color: #1e293b; }
  .btn-green { background: #16a34a; color: #fff; }
  .btn-red { background: #dc2626; color: #fff; }
  .btn-purple { background: #7c3aed; color: #fff; }
  .btn-indigo { background: #4f46e5; color: #fff; }
  .btn-ghost { background: rgba(255,255,255,0.08); color: #f1f5f9; font-weight: 400; }
  input { font-family: inherit; font-size: 1rem; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; width: 100%; outline: none; }
  input:focus { border-color: #f59e0b; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 480px) { .grid4 { grid-template-columns: repeat(4, 1fr); } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.8rem; }
  .chip { background: rgba(255,255,255,0.08); border-radius: 10px; padding: 4px 10px; }
  .chip-amber { background: rgba(245,158,11,0.2); color: #fcd34d; }
  .chip-red { background: rgba(239,68,68,0.2); color: #fca5a5; }
  .card { position: relative; background: #fff; color: #1e293b; border-radius: 12px; border: 2px solid #94a3b8; padding: 8px 10px; text-align: left; width: 100%; font-weight: 400; }
  .card.selected { outline: 4px solid #fbbf24; transform: translateY(-3px); }
  .card .type { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .name { font-size: 0.85rem; font-weight: 800; line-height: 1.15; margin-top: 1px; }
  .card .info { font-size: 0.68rem; color: #475569; margin-top: 2px; }
  .card.blocked { opacity: 0.5; }
  .badge { position: absolute; top: -8px; right: -6px; background: #fbbf24; color: #1e293b; font-size: 0.6rem; font-weight: 800; border-radius: 999px; padding: 2px 7px; }
  .pbox { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 8px; font-size: 0.72rem; }
  .pbox.me { background: rgba(245,158,11,0.13); border: 1px solid rgba(245,158,11,0.4); }
  .pbox .pname { font-weight: 800; color: #e2e8f0; }
  .pbox .dead { color: #f87171; }
  .landpill { display: inline-block; border-radius: 8px; padding: 1px 7px; margin: 1px 2px 1px 0; font-size: 0.68rem; }
  .land-free { background: rgba(34,197,94,0.2); color: #bbf7d0; }
  .land-full { background: rgba(255,255,255,0.1); color: #94a3b8; }
  .mon { display: inline-block; background: rgba(239,68,68,0.15); color: #fecaca; border-radius: 8px; padding: 2px 7px; margin: 1px 2px 1px 0; font-size: 0.68rem; }
  .stf { display: inline-block; background: rgba(6,182,212,0.15); color: #a5f3fc; border-radius: 8px; padding: 2px 7px; margin: 1px 2px 1px 0; font-size: 0.68rem; cursor: pointer; text-decoration: underline dotted; }
  .stfdetail { background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.3); border-radius: 8px; padding: 6px 8px; margin-top: 4px; font-size: 0.66rem; color: #cffafe; }
  .banner { border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; text-align: center; font-weight: 800; }
  .banner.your { background: rgba(245,158,11,0.18); border: 1px solid rgba(245,158,11,0.5); color: #fcd34d; }
  .banner.wait { background: rgba(255,255,255,0.06); color: #94a3b8; font-weight: 600; }
  .banner.warn { background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.5); color: #fca5a5; }
  #actionbar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,23,42,0.96); border-top: 1px solid rgba(255,255,255,0.1); padding: 12px; z-index: 10; }
  #actionbar .inner { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #actionbar .inner > button { flex: 1 1 120px; }
  #actionbar .note { width: 100%; text-align: center; font-size: 0.7rem; color: #94a3b8; margin-top: 4px; }
  #status { position: fixed; top: 0; left: 0; right: 0; text-align: center; font-size: 0.7rem; padding: 4px; z-index: 20; background: rgba(239,68,68,0.9); color: #fff; display: none; }
  #toast { position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%); background: rgba(220,38,38,0.95); color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 0.85rem; z-index: 30; display: none; max-width: 90%; text-align: center; }
  .logbox { max-height: 180px; overflow-y: auto; font-size: 0.72rem; color: #cbd5e1; }
  .logbox div { padding: 2px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); }
  .season { background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.4); border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; font-size: 0.85rem; }
  .season .t { font-weight: 800; color: #fcd34d; }
  .season .h { font-size: 0.7rem; color: #cbd5e1; margin-top: 2px; }
  .bigcode { font-size: 2.6rem; font-weight: 800; letter-spacing: 0.3em; color: #fcd34d; text-align: center; }
  .rev { background: linear-gradient(180deg, rgba(245,158,11,0.15), rgba(30,27,75,0.4)); border: 1px solid rgba(245,158,11,0.4); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .rev h2 { font-size: 1.1rem; color: #fcd34d; text-align: center; margin-bottom: 10px; }
  .revrow { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 0.85rem; }
  .revrow.me { background: rgba(245,158,11,0.2); border: 1px solid rgba(245,158,11,0.4); }
  .revrow .pts { font-weight: 800; white-space: nowrap; margin-left: 10px; }
  .goal { font-size: 0.68rem; color: #94a3b8; }
  .chatrow { display: flex; gap: 8px; margin-top: 8px; }
  .chatrow input { flex: 1; padding: 8px 12px; font-size: 0.85rem; }
  .chatrow button { padding: 8px 14px; font-size: 0.85rem; }
</style>
</head>
<body>
<div id="status">⚠️ Verbindung getrennt – versuche neu zu verbinden…</div>
<div id="toast"></div>
<div class="wrap" id="app"></div>
<div id="actionbar" style="display:none"><div class="inner" id="actionbar-inner"></div></div>

<script>
"use strict";
const REALMS = [
  { id: "wald", name: "Verwusch. Wald", short: "Wald", emoji: "🌲" },
  { id: "tiefsee", name: "Tiefsee", short: "Tiefsee", emoji: "🌊" },
  { id: "wolken", name: "Wolkenlande", short: "Wolken", emoji: "☁️" },
  { id: "hoehlen", name: "Höhlenlande", short: "Höhlen", emoji: "🕳️" },
  { id: "dunkel", name: "Dunkellande", short: "Dunkel", emoji: "🌑" },
];
const TRAUM = { id: "traum", name: "Traumlande", short: "Traum", emoji: "🌙" };
const ALL_REALMS = [...REALMS, TRAUM];
const realmInfo = (id) => ALL_REALMS.find((r) => r.id === id) || TRAUM;

const app = document.getElementById("app");
const actionBar = document.getElementById("actionbar");
const actionInner = document.getElementById("actionbar-inner");
const statusEl = document.getElementById("status");
const toastEl = document.getElementById("toast");

let ws = null;
let state = null;
let selected = null;       // aktuell gewählte Karte (aus Hand oder Aufbewahrung)
let selectedFrom = null;    // "hand" | "stored"
let staffDetail = null;    // {pi, name}
let revealStep = 0;
let myName = "";
let manualClose = false;
let menagerieOpen = false;  // eigene Menagerie aufgeklappt? (nur für dich sichtbar)
let goalsOpen = false;      // eigene Ziele aufgeklappt?
let simSel = null;          // ⚡ Schnell: verdeckte Wahl {cardId, action, realm}
let simDiscard = null;      // ⚡ Schnell (2er): Karte für die offene Ablage
window._simEditing = false; // ⚡ „Ändern“-Modus nach dem Bestätigen

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (toastEl.style.display = "none"), 3500);
}

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function connect() {
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(proto + location.host);
  ws.onopen = () => {
    statusEl.style.display = "none";
    const token = localStorage.getItem("com-token");
    if (token) send({ t: "resume", token });
    else renderConnect();
  };
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.t === "state") {
      state = msg;
      // Auswahl zurücksetzen, wenn die gewählte Karte nicht mehr bei mir liegt
      if (selected && !(state.hand || []).concat(state.stored || []).some((c) => c.id === selected.id)) selected = null;
      // ⚡ verdeckte Wahl pflegen: nach der Ausführung ist sie weg, nach Reconnect wiederherstellen
      if (simSel && !((state.hand || []).some((c) => c.id === simSel.cardId))) { simSel = null; simDiscard = null; }
      if (!state.mySimPick) {
        if (!simSel) window._simEditing = false;
      } else if (!simSel && (state.hand || []).some((c) => c.id === state.mySimPick.cardId)) {
        simSel = { cardId: state.mySimPick.cardId, action: state.mySimPick.action, realm: state.mySimPick.realm };
        simDiscard = state.mySimPick.discardId || null;
      }
      render();
    }
    else if (msg.t === "token") localStorage.setItem("com-token", msg.token);
    else if (msg.t === "error") { toast(msg.msg); if (!state) renderConnect(); }
  };
  ws.onclose = () => {
    statusEl.style.display = "block";
    if (!manualClose) setTimeout(connect, 2000);
  };
}

// ---------------------------- Bausteine -------------------------------------

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function cardBorder(c) {
  return c.type === "Land" ? "#65a30d" : c.type === "Monster" ? "#dc2626" : c.type === "Ziel" ? "#7c3aed" : c.type === "Event" ? "#ea580c" : "#0891b2";
}
function cardTypeLabel(c) {
  const ri = realmInfo(c.realm);
  if (c.type === "Monster") return `${ri.emoji} Monster · Level ${c.cost}`;
  if (c.type === "Land") return `${ri.emoji} Land · ${c.level} Pkt.${c.level >= 2 && c.realm !== "traum" ? " · entfernt" : ""}`;
  return c.type === "Mitarbeiter" ? "👷 Mitarbeiter" : c.type === "Event" ? "🎪 Event" : "🔒 Ziel";
}
function cardInfo(c) {
  const ri = realmInfo(c.realm);
  let t = "";
  if (c.type === "Monster") {
    t = `Belegt ${c.cost} ${c.realm === "traum" ? "🌙 (oder 🌙+1 Reich)" : ri.emoji} · ⭐${c.points}`;
    if (c.draw > 0) t += ` · 🃏 zieht ${c.draw}`;
    if (c.danger > 0) t += ` · ⚠️ ${c.danger}`;
  } else if (c.type === "Mitarbeiter" || c.type === "Event" || c.type === "Ziel") {
    t = (c.type === "Mitarbeiter" ? `−${c.cost} 👑 · ` : "") + (c.text || "");
  }
  return t;
}
function cardHTML(c, opts) {
  opts = opts || {};
  const border = cardBorder(c);
  const blocked = opts.blocked ? " blocked" : "";
  const sel = opts.selected ? " selected" : "";
  const badge = opts.blocked && c.type === "Monster" ? `<span class="badge">gesperrt</span>` : "";
  const onclick = opts.onClick ? `onclick="${opts.onClick}"` : "disabled";
  return `<button class="card${sel}${blocked}" style="border-color:${border}" ${onclick}>
    <div class="type" style="color:${border}">${cardTypeLabel(c)}</div>
    <div class="name">${esc(c.name || realmInfo(c.realm).name)}</div>
    <div class="info">${esc(cardInfo(c))}</div>
    ${badge}</button>`;
}
function freeLandsOf(lands, seasonMonsters) {
  const occ = {};
  (seasonMonsters || []).forEach((m) => {
    if (m.realm === "traum") {
      occ.traum = (occ.traum || 0) + (m.paidTraum || 0);
      if (m.helperRealm) occ[m.helperRealm] = (occ[m.helperRealm] || 0) + (m.helperCount || 0);
    } else occ[m.realm] = (occ[m.realm] || 0) + m.cost;
  });
  const f = {};
  ALL_REALMS.forEach((r) => { f[r.id] = (lands[r.id] || 0) - (occ[r.id] || 0); });
  return f;
}
function canPlayMonster(m, me) {
  const free = freeLandsOf(me.lands, me.seasonMonsters);
  if (m.realm === "traum") {
    if (free.traum >= m.cost) return true;
    return REALMS.some((r) => free[r.id] + free.traum >= m.cost);
  }
  return (free[m.realm] || 0) >= m.cost;
}
function canPlayLand(c, me) {
  if (c.realm === "traum") return true;
  if (c.level === 1) return true;
  if (c.level === 2) return (me.lands[c.realm] || 0) >= 1;
  return (me.lands[c.realm] || 0) >= 2;
}
function cardPlayable(c, me) {
  if (c.type === "Monster") return canPlayMonster(c, me);
  if (c.type === "Land") return canPlayLand(c, me);
  return true;
}

function playersGrid(s) {
  const meIdx = s.you;
  return `<div class="grid2">${s.players.map((p, i) => {
    const free = freeLandsOf(p.lands, p.seasonMonsters);
    const landpills = ALL_REALMS.filter((r) => (p.lands[r.id] || 0) > 0)
      .map((r) => `<span class="landpill ${free[r.id] > 0 ? "land-free" : "land-full"}">${r.emoji} ${free[r.id]}/${p.lands[r.id]}</span>`).join("");
    const mons = p.seasonMonsters.map((m) => `<span class="mon">${realmInfo(m.realm).emoji} ${esc(m.name)} ⭐${m.points}${m.danger ? " ⚠️" + m.danger : ""}</span>`).join("");
    const stf = p.staff.map((x) => `<span class="stf" onclick="toggleStaff(${i},'${esc(x.name)}')">👷 ${esc(x.name)}</span>`).join("");
    const detail = staffDetail && staffDetail.pi === i ? (() => {
      const st = p.staff.find((x) => x.name === staffDetail.name);
      return st ? `<div class="stfdetail"><b>👷 ${esc(st.name)}</b> (−${st.cost} 👑): ${esc(st.text)}</div>` : "";
    })() : "";
    return `<div class="pbox ${i === meIdx ? "me" : ""}">
      <div class="pname">${p.connected ? "" : "📴 "}${esc(p.name)} · 👑${p.coins} · 🏹${p.hunters}${p.credits ? " · 🏦" + p.credits : ""}${p.trophies ? " · 🏆" + p.trophies : ""}</div>
      <div>${landpills || '<span class="muted">keine Länder</span>'}</div>
      <div>${mons || ""}</div>
      ${stf ? `<div>${stf}</div>` : ""}${detail}
    </div>`;
  }).join("")}</div>`;
}
window.toggleStaff = (pi, name) => {
  staffDetail = staffDetail && staffDetail.pi === pi && staffDetail.name === name ? null : { pi, name };
  render();
};
window.toggleMenagerie = () => {
  menagerieOpen = !menagerieOpen;
  render();
};
window.toggleGoals = () => {
  goalsOpen = !goalsOpen;
  render();
};
// 🃏 Zieh-Schlange: über JEDE gezogene Karte wird einzeln entschieden –
// ausspielen (gratis) oder einlagern. Der Zug geht erst weiter, wenn alles entschieden ist.
window.freshPlay = (id) => send({ t: "freshDecide", cardId: id, action: "play", realm: window._freshRealm || null });
window.freshKeep = (id) => send({ t: "freshDecide", cardId: id, action: "keep" });
window.freshClear = () => send({ t: "freshClear" });
window.chooseFreshRealm = (rid) => { window._freshRealm = rid; render(); };

function header(s) {
  const me = s.players[s.you];
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;margin-bottom:8px">
    <b>🎡 Saison ${s.season + 1}/${s.totalSeasons || 4}</b>
    <span class="chips">
      <span class="chip chip-amber">👑 ${me.coins}</span>
      <span class="chip">🏹 ${me.hunters}</span>
      ${me.credits ? `<span class="chip chip-red">🏦 ${me.credits}</span>` : ""}
      ${(s.mode || "langsam") === "langsam" ? `<span class="chip">🐢 Langsam</span>` : s.mode === "schnell" ? `<span class="chip">⚡ Schnell</span>` : `<span class="chip">🚀 Turbo</span>`}
    </span>
  </div>`;
}
function seasonBox(s) {
  return `<div class="season"><div class="t">🎴 ${esc(s.seasonName)}${s.bonusGiven ? ' <span class="muted">(2-Kronen-Bonus bereits kassiert)</span>' : ""}</div>
  <div class="h">${esc(s.seasonHint)} · Trophäe (+3 SP) für die ${s.seasonCard === "gefahr" ? "meisten ⚠️" : "meisten ⭐ darin"} · 1 übrig gebliebene Krone = 1 SP, 1 Jägermarker = 1 SP</div></div>`;
}
function turnBanner(s) {
  if (s.phase === "draft") {
    if (s.mode === "turbo") {
      if (s.turboDiscard) return `<div class="banner your">🗑️ Lege jetzt 1 Karte OFFEN aus dem Spiel ab!</div>`;
      if (s.hand.length > 0) return `<div class="banner your">🚀 Du bist dran – wähle eine Karte!</div>`;
      const n = s.players.length;
      const dirLeft = s.season % 2 === 0;
      const pred = s.players[dirLeft ? (s.you - 1 + n) % n : (s.you + 1) % n];
      return `<div class="banner wait">⏳ ${esc(pred.name)} spielt gerade – deine neuen Karten kommen gleich…</div>`;
    }
    // ⚡ Schnell & 🐢 Langsam: alle wählen gleichzeitig verdeckt
    if (s.mode === "schnell" || s.mode === "langsam") {
      const chips = `<div class="chips" style="margin-top:6px;justify-content:center">${s.players.map((p, i) => `<span class="chip">${s.simReady && s.simReady[i] ? "✅" : "⏳"} ${esc(p.name)}</span>`).join("")}</div>`;
      // 🐢 Aufdeck-Phase: reihum deckt jeder seine Karte selbst auf
      if (s.showTurn >= 0) {
        if (s.awaitDiscard === s.you) return `<div class="banner your">🗑️ Lege jetzt 1 Karte OFFEN aus dem Spiel ab!</div>`;
        if (s.showTurn === s.you) {
          if ((s.freshDraw || []).some((c) => c.type !== "Ziel"))
            return `<div class="banner your">🃏 Entscheide erst über deine gezogenen Karten – dann geht es weiter!</div>`;
          return `<div class="banner your">🔍 Du bist dran – decke deine Karte auf!</div>
            <div class="center" style="margin-top:6px"><button class="btn-green" onclick="revealNow()">👁️ Jetzt aufdecken!</button></div>`;
        }
        return `<div class="banner wait">⏳ ${esc(s.players[s.showTurn].name)} deckt gerade auf…</div>`;
      }
      if (s.mySimPick && !window._simEditing)
        return `<div class="banner your">✅ Deine Wahl steht fest – warte auf die anderen…</div>${chips}
          <div class="center" style="margin-top:6px"><button class="btn-ghost" style="font-size:0.8rem;padding:6px 12px" onclick="simEdit()">✏️ Ändern</button></div>`;
      if (simSel) {
        if (s.players.length === 2 && s.mode === "schnell" && s.hand.length > 1 && !simDiscard)
          return `<div class="banner your">🗑️ Karte gewählt – jetzt die ABWURFKARTE antippen: Sie wird OFFEN abgelegt und alle sehen sie!</div>${chips}`;
        return `<div class="banner your">✅ Deine Wahl steht – tippe unten auf „✅ Fertig!“</div>${chips}`;
      }
      return `<div class="banner your">${s.mode === "langsam" ? "🐢" : "⚡"} Alle wählen gleichzeitig verdeckt – such dir eine Karte aus!</div>${chips}`;
    }
    if (s.awaitDiscard >= 0) {
      if (s.awaitDiscard === s.you) return `<div class="banner your">🗑️ Lege jetzt 1 Karte OFFEN aus dem Spiel ab!</div>`;
      const dc = s.players[s.awaitDiscard];
      return `<div class="banner wait">⏳ ${esc(dc.name)} legt eine Karte offen ab…</div>`;
    }
    if (s.isYourTurn) return `<div class="banner your">🎯 Du bist am Zug – wähle eine Karte!</div>`;
    const cur = s.players[s.turn];
    return `<div class="banner wait">⏳ ${esc(cur.name)} ist am Zug…${cur.connected ? "" : " (Verbindung verloren – warte auf Rückkehr)"}</div>`;
  }
  if (s.phase === "seasonEnd") {
    if (s.isYourSeasonTurn) return `<div class="banner your">📐 Du darfst noch Eingelagertes ausspielen!</div>`;
    const cur = s.players[s.seTurn];
    return `<div class="banner wait">⏳ ${esc(cur.name)} spielt noch Eingelagertes…</div>`;
  }
  return "";
}
function logBox(s) {
  return `<div class="card-panel"><div class="label">Spielverlauf &amp; Chat</div>
    <div class="logbox">${(s.log || []).map((l) => `<div>${esc(l)}</div>`).join("") || ""}</div>
    <div class="chatrow"><input id="chatinput" placeholder="Nachricht an alle…" maxlength="200" /><button class="btn-ghost" onclick="sendChat()">💬</button></div>
  </div>`;
}
window.sendChat = () => {
  const el = document.getElementById("chatinput");
  if (el && el.value.trim()) send({ t: "chat", text: el.value.trim() });
  if (el) el.value = "";
};
window.pickPlay = () => send({ t: "pick", cardId: selected.id, action: "play", realm: window._realm });
// 🌙 Traum-Monster: Hilfsreich selber aussuchen (Nutzer-Wunsch)
window.pickTraum = (rid) => send({ t: "pick", cardId: selected.id, action: "play", realm: rid });
window.freshDecideTraum = (id, rid) => send({ t: "freshDecide", cardId: id, action: "play", realm: rid });
window.pickKeep = () => send({ t: "pick", cardId: selected.id, action: "keep" });
window.discardOpen = () => send({ t: "discard", cardId: selected.id });
window.setSeasons = (n) => send({ t: "setSeasons", seasons: n });
window.setMode = (m) => send({ t: "setMode", mode: m });
// ⚡ Schnell: verdeckte Wahl stufenweise zusammenbauen, dann bestätigen
window.stagePlay = () => { simSel = { cardId: selected.id, action: "play", realm: window._realm || null }; render(); };
window.stageTraum = (rid) => { simSel = { cardId: selected.id, action: "play", realm: rid }; render(); };
window.stageKeep = () => { simSel = { cardId: selected.id, action: "keep", realm: null }; simDiscard = null; render(); };
window.simSetDiscard = (id) => { if (simDiscard === id) simDiscard = null; else simDiscard = id; render(); };
window.simConfirm = () => { window._simEditing = false; send({ t: "simPick", cardId: simSel.cardId, action: simSel.action, realm: simSel.realm, discardId: simDiscard }); };
window.simEdit = () => { simSel = null; simDiscard = null; window._simEditing = true; render(); };
window.revealNow = () => send({ t: "reveal" }); // 🐢 Langsam: „Jetzt aufdecken!“
window.chooseRealm = (rid) => { window._realm = rid; renderActionBar(); };
window.seasonDone = () => send({ t: "seasonDone" });
window.next = () => send({ t: "next" });
window.rematch = () => send({ t: "rematch" });
window.revealNext = () => { revealStep++; render(); };

function myZone(s) {
  const me = s.players[s.you];
  const freshBusy = (s.freshDraw || []).some((c) => c.type !== "Ziel");
  // Eingelagertes ist in allen Tempos jederzeit spielbar
  const canUse = ((s.phase === "draft") || (s.phase === "seasonEnd" && s.isYourSeasonTurn))
    && !(s.mode === "langsam" && s.awaitDiscard === s.you)
    && !s.turboDiscard;
  const storedCards = s.stored.map((c) => cardHTML(c, {
    onClick: canUse ? `selectCard(${c.id},'stored')` : null,
    blocked: canUse && c.type === "Monster" && !canPlayMonster(c, me),
    selected: selected && selected.id === c.id,
  })).join("");
  const goals = s.goals.map((g) => cardHTML(g)).join("");
  // Private Menagerie (abgeschlossene Saisons) – ohne Anzahl & Summe, das kommt erst am Ende raus.
  const meng = (s.menagerie || []).map((m) => `<span class="mon">${realmInfo(m.realm).emoji} ${esc(m.name)} ⭐${m.points}${m.danger ? " ⚠️" + m.danger : ""}</span>`).join("");
  return `<div class="card-panel">
    <div class="label">Nur für dich sichtbar 👀</div>
    ${s.stored.length ? `<div class="label">📥 Eingelagert – ${canUse ? "antippen zum Ausspielen" : "warten auf deinen Zug"}</div><div class="grid4">${storedCards}</div>` : ""}
    <button class="btn-ghost" style="width:100%;margin-top:10px" onclick="toggleMenagerie()">🦁 Deine Menagerie ${menagerieOpen ? "▴" : "▾"}</button>
    ${menagerieOpen ? `<div class="chips" style="margin-top:8px">${meng || '<span class="muted">Noch keine Monster in der Menagerie.</span>'}</div>` : ""}
    ${s.goals.length ? `<button class="btn-ghost" style="width:100%;margin-top:10px" onclick="toggleGoals()">🔒 Deine Ziele: ${s.goals.length} ${goalsOpen ? "▴" : "▾"}</button>${goalsOpen ? `<div class="grid4" style="margin-top:8px">${goals}</div>` : ""}` : ""}
  </div>`;
}
window.selectCard = (id, from) => {
  const src = from === "hand" ? state.hand : state.stored;
  selected = src.find((c) => c.id === id) || null;
  selectedFrom = from;
  window._realm = null;
  render();
};

function renderActionBar() {
  if (!selected || !(state.phase === "draft" || state.phase === "seasonEnd")) { actionBar.style.display = "none"; return; }
  // ⚡/🐢 schon bestätigt und nicht im Ändern-Modus: nichts mehr zu tun
  if ((state.mode === "schnell" || state.mode === "langsam") && state.phase === "draft" && state.mySimPick && !window._simEditing) { actionBar.style.display = "none"; return; }
  // offene Ablage: 2er-Wartezustand (Langsam) oder persönlicher Turbo-Schritt
  if (state.phase === "draft" && (state.awaitDiscard === state.you || (state.mode === "turbo" && state.turboDiscard))) {
    if (state.mode === "turbo" && selectedFrom !== "hand") { actionBar.style.display = "none"; return; }
    actionInner.innerHTML = `<button style="background:#ea580c;color:#fff;flex:1" onclick="discardOpen()">🗑️ „${esc(selected.name || realmInfo(selected.realm).name)}" offen aus dem Spiel ablegen</button>
      <div class="note">Alle sehen, was raus ist. Danach wird 1 Karte verdeckt vom Nachziehstapel auf den weiterzugebenden Stapel gelegt.</div>`;
    actionBar.style.display = "block";
    return;
  }
  const me = state.players[state.you];
  let canUse;
  if (state.phase === "seasonEnd") canUse = state.isYourSeasonTurn;
  else if (state.mode === "langsam") canUse = state.isYourTurn;
  else canUse = true; // ⚡/🚀: Eingelagertes jederzeit, Hand sobald du Karten hast
  if (!canUse) { actionBar.style.display = "none"; return; }
  // ⚡/🐢 Schnell & Langsam: Hand-Karten werden nur verdeckt GEWÄHLT –
  // ⚡ führt der „Fertig“-Klick alles aus, 🐢 der eigene „Jetzt aufdecken!“-Button
  const staging = (state.mode === "schnell" || state.mode === "langsam") && state.phase === "draft" && selectedFrom === "hand";
  const staged = staging && simSel && selected.id === simSel.cardId; // ⚡ Wahl steht schon: Buttons ausgrauen
  const onPlay = staging ? "stagePlay()" : "pickPlay()";
  const onKeep = staging ? "stageKeep()" : "pickKeep()";
  const traumFn = staging ? "stageTraum" : "pickTraum";
  let inner = "";
  if (staging && !staged) inner = state.mode === "langsam"
    ? `<div class="note" style="margin-bottom:6px">🐢 Deine Wahl bleibt verdeckt – wenn alle fertig sind, deckt ihr NACHEINANDER auf. Du klickst selbst „Jetzt aufdecken!“.</div>`
    : `<div class="note" style="margin-bottom:6px">⚡ Deine Wahl bleibt verdeckt – alles wird gleichzeitig ausgeführt, sobald alle fertig sind.</div>`;
  const inHand = selectedFrom === "hand";
  const isEntdecker = selected.type === "Mitarbeiter" && selected.kind === "land";
  if (isEntdecker) {
    inner = `<div class="note" style="margin-bottom:6px">„${esc(selected.name)}" – Typ des Landes festlegen: <b>dauerhaft!</b> (−${selected.cost} 👑)</div>`;
    inner += ALL_REALMS.map((r) => `<button class="btn-indigo" onclick="chooseRealm('${r.id}')" ${staged ? "disabled" : ""}>${r.emoji} ${r.short}${window._realm === r.id ? " ✓" : ""}</button>`).join("");
    inner += `<button class="btn-green" onclick="${onPlay}" ${window._realm && !staged ? "" : "disabled"}>✅ Ausspielen</button>`;
  } else if (selected.type === "Monster" && selected.realm === "traum") {
    // 🌙 Traum-Monster: Bezahlung selber aussuchen (Nutzer-Wunsch)
    const free = freeLandsOf(me.lands, me.seasonMonsters);
    let opts = "";
    if (free.traum >= selected.cost)
      opts += `<button class="btn-green" style="flex:1;min-width:150px" onclick="${traumFn}(null)" ${staged ? "disabled" : ""}>✅ Nur 🌙 (${selected.cost} 🌙)</button>`;
    REALMS.forEach((r) => {
      const helper = free[r.id] || 0;
      if (helper > 0 && free.traum < selected.cost && free.traum + helper >= selected.cost)
        opts += `<button class="btn-indigo" style="flex:1;min-width:150px" onclick="${traumFn}('${r.id}')" ${staged ? "disabled" : ""}>✅ ${free.traum} 🌙 + ${selected.cost - free.traum} ${r.emoji}</button>`;
    });
    inner = `<div class="note" style="margin-bottom:6px">🌙 Traum-Monster – bezahlt mit Traumland und/oder GENAU EINEM Hilfsreich:</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${opts || '<span class="muted">Passt gerade nicht – zu wenig freie Landpunkte.</span>'}</div>`;
    if (state.phase === "draft" && inHand)
      inner += `<button class="btn-indigo" style="width:100%;margin-top:8px" onclick="${onKeep}" ${staged ? "disabled" : ""}>📥 Einlagern (−1 👑)</button>`;
  } else if (selected.type === "Ziel") {
    inner = `<button class="btn-purple" onclick="${onKeep}" ${state.phase === "draft" && inHand && !staged ? "" : "disabled"}>📥 Als Ziel annehmen (−1 👑)</button>`;
  } else {
    const playable = cardPlayable(selected, me);
    inner = `<button class="btn-green" onclick="${onPlay}" ${playable && !staged ? "" : "disabled"}>✅ Ausspielen${selected.type === "Mitarbeiter" ? ` (−${selected.cost} 👑)` : ""}</button>`;
    inner += `<button class="btn-indigo" onclick="${onKeep}" ${state.phase === "draft" && inHand && !staged ? "" : "disabled"}>📥 Einlagern (−1 👑)</button>`;
  }
  let note = `„${esc(selected.name || realmInfo(selected.realm).name)}"`;
  const me2 = state.players[state.you];
  if (selected.type === "Monster" && !canPlayMonster(selected, me2))
    note += selected.realm === "traum" ? " – braucht 🌙 bzw. 🌙+EIN Reich!" : " – zu wenig Kapazität!";
  if (selected.type === "Land" && !canPlayLand(selected, me2)) note += " – entfernte Länder brauchen Vorbedingung";
  if (selected.type === "Mitarbeiter" && me2.coins < selected.cost) note += " · 🏦 Kredit nötig (+3 👑, −5 SP)";
  if (selected.type === "Ziel") note += " · Ziele nur annehmen, nicht ausspielen";
  if (staged) inner = `<div class="note" style="margin-bottom:6px">✅ Diese Karte ist schon gewählt – tippe unten auf „✅ Fertig!“. Mit „✏️ Ändern“ oder einer anderen Handkarte kannst du noch neu wählen.</div>` + inner;
  actionInner.innerHTML = inner + `<div class="note">${note}</div>`;
  actionBar.style.display = "block";
}

      ${s.isHost

window.startGame = () => send({ t: "start" });

function renderDanger(s) {

  const rows = d.results.map((r) => {

  }).join("");

function renderReveal(s) {
  const rv = s.reveal;
  let body = "";
  const rows = (list, fn) => list.map((p) => {
    const idx = rv.players.indexOf(p);
    return `<div class="revrow ${!p.isBot && idx === s.you ? "me" : ""}">${fn(p)}</div>`;
  }).join("");
  if (revealStep === 0) body = `<p class="center muted" style="margin-bottom:8px">Zuerst: die Menagerien!</p>` +
    rows(rv.players, (p) => `<span>👤 ${esc(p.name)} · ${p.monsterCount} Monster</span><span class="pts">⭐ ${p.monPts}</span>`);
  if (revealStep === 1) body = `<p class="center muted" style="margin-bottom:8px">Trophäen der Saisons (+3 je Trophäe)</p>` +
    rows(rv.players, (p) => `<span>👤 ${esc(p.name)} · 🏆 ${p.trophies}</span><span class="pts">+${p.trophyPts}</span>`);
  if (revealStep === 2) body = `<p class="center" style="color:#fde68a;margin-bottom:8px">🔮 Die geheimen Ziele werden aufgedeckt!</p>` +
    rv.players.map((p, i) => `<div style="margin-bottom:10px">
      <div class="label" style="margin-bottom:4px">👤 ${esc(p.name)}</div>
      ${p.goalResults.length === 0 ? '<span class="muted">keine Ziele</span>' : ""}
      ${p.goalResults.map((gr) => `<div class="revrow" style="background:${gr.pts > 0 ? "rgba(124,58,237,0.25)" : "rgba(255,255,255,0.05)"};opacity:${gr.pts > 0 ? 1 : 0.65}">
        <span><b>${esc(gr.name)}</b> <span class="goal">(${esc(gr.text)})</span></span><span class="pts">+${gr.pts}</span></div>`).join("")}
      </div>`).join("");
  if (revealStep === 3) body = `<p class="center muted" style="margin-bottom:8px">Kronen, Jäger &amp; Kredite (1 👑 = 1 SP · 1 🏹 = 1 SP · Kredit = −5 SP)</p>` +
    rv.players.map((p, i) => `<div class="revrow ${i === s.you ? "me" : ""}">
      <span>👤 ${esc(p.name)}</span>
      <span class="pts">+${p.coinsPts + p.hunterPts} ${p.creditPts ? `<span style="color:#f87171">−${-p.creditPts}</span>` : ""}
        <span class="goal">(👑${p.coins} ×1 · 🏹${p.hunters} ×1 · 🏦${p.credits})</span></span></div>`).join("");
  if (revealStep >= 4) {
    body = `<p class="center" style="color:#fde68a;margin-bottom:8px">Das Endergebnis!</p>` +
      rv.ranked.map((p, i) => `<div class="revrow ${rv.players.indexOf(p) === s.you ? "me" : ""}">
        <span><b>${i === 0 ? "🥇" : i === 1 ? "🥈" : "🥉"} ${esc(p.name)}</b></span><span class="pts">${p.total} SP</span></div>`).join("") +
      `<div class="center" style="margin-top:12px;font-weight:800;color:#fcd34d">🎉 ${esc(rv.ranked[0].name)} wird als neues Mitglied in die Königlich Monstrologische Gesellschaft aufgenommen!</div>` +
      (s.isHost ? `<button class="btn-amber" style="width:100%;margin-top:12px" onclick="rematch()">🔄 Neue Partie im gleichen Raum</button>`
                : `<div class="banner wait" style="margin-top:12px">Der Host kann eine neue Partie starten…</div>`);
  }
  const nextBtn = revealStep < 4 ? `<button class="btn-amber" style="width:100%;margin-top:10px" onclick="revealNext()">▶️ Weiter aufdecken</button>` : "";
  return `<div class="rev"><h2>🏁 Die große Schlusswertung</h2>${body}${nextBtn}</div>`;
}

function render() {
  if (!state) { renderConnect(); return; }
  if (state.phase === "lobby") { actionBar.style.display = "none"; renderLobby(state); return; }
  const s = state;
  const freshBusy = (s.freshDraw || []).some((c) => c.type !== "Ziel");
  let html = header(s) + seasonBox(s) + turnBanner(s);
  html += `<div class="label">Alle Spieler (öffentliche Infos)</div>` + playersGrid(s);
  // 2er-Regeln: offene Ablage + Nachziehstapel (öffentliche Info)
  if (s.players.length === 2 && s.phase === "draft") {
    const chips = (s.openDiscards || []).map((d) =>
      `<span class="chip" style="background:rgba(249,115,22,0.18);color:#fdba74">${esc(s.players[d.by].name)}: ${esc(d.card.name)}${d.card.type === "Monster" ? " ⭐" + d.card.points : d.card.type === "Land" ? " +" + d.card.level : ""}</span>`).join("");
    html += `<div class="card-panel"><div class="label">🗑️ Offene Ablage · Nachziehstapel: ${s.stackCount || 0} Karten verdeckt</div>
      <div class="chips">${chips || '<span class="muted">Noch nichts offen abgelegt.</span>'}</div></div>`;
  }
  html += myZone(s);
  // 🃏 Zieh-Schlange – jede gezogene Karte einzeln entscheiden, erst dann geht der Zug weiter
  if ((s.phase === "draft" || s.phase === "seasonEnd") && (s.freshDraw || []).length) {
    const open = s.freshDraw.filter((c) => c.type !== "Ziel");
    const cur = open[0];
    if (cur && window._freshRealmFor !== cur.id) { window._freshRealm = null; window._freshRealmFor = cur.id; }
    html += `<div class="card-panel" style="border:2px solid #fbbf24;background:rgba(251,191,36,0.08)">
      <div class="label" style="color:#fcd34d">🃏 Gratis gezogen${open.length > 1 ? ` – noch ${open.length} offen` : ""}</div>
      <div class="grid4" style="max-width:440px">${s.freshDraw.map((c) => cardHTML(c, { selected: cur && c.id === cur.id })).join("")}</div>
      ${s.freshDraw.some((c) => c.type === "Ziel") ? `<p class="muted center" style="margin-top:6px">🔒 Gezogene Ziele liegen direkt bei deinen Zielen – gratis angenommen.</p>` : ""}
      ${s.mode === "schnell" ? `<p class="muted center" style="margin-top:6px">⚡ Dein neues Blatt bleibt verdeckt, bis du entschieden hast – das ist fair für alle.</p>` : ""}`;
    if (cur) {
      if (cur.type === "Mitarbeiter" && cur.kind === "land") {
        html += `<p class="muted center" style="margin-top:8px">„${esc(cur.name)}" – Typ des Landes festlegen: <b>dauerhaft!</b></p>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${ALL_REALMS.map((r) => `<button class="btn-indigo" style="flex:1;font-size:0.85rem" onclick="chooseFreshRealm('${r.id}')">${r.emoji}${window._freshRealm === r.id ? " ✓" : ""}</button>`).join("")}</div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn-green" style="flex:1" ${window._freshRealm ? "" : "disabled"} onclick="freshPlay(${cur.id})">✅ Diese ausspielen</button>
            <button class="btn-indigo" style="flex:1" onclick="freshKeep(${cur.id})">📥 Diese einlagern (gratis)</button>
          </div>`;
      } else if (cur.type === "Monster" && cur.realm === "traum") {
        // 🌙 Traum-Monster aus der Zieh-Schlange: Hilfsreich selber aussuchen
        const free = freeLandsOf(s.players[s.you].lands, s.players[s.you].seasonMonsters);
        let opts = "";
        if (free.traum >= cur.cost)
          opts += `<button class="btn-green" style="flex:1;min-width:150px" onclick="freshDecideTraum(${cur.id},null)">✅ Nur 🌙 (${cur.cost} 🌙)</button>`;
        REALMS.forEach((r) => {
          const helper = free[r.id] || 0;
          if (helper > 0 && free.traum < cur.cost && free.traum + helper >= cur.cost)
            opts += `<button class="btn-indigo" style="flex:1;min-width:150px" onclick="freshDecideTraum(${cur.id},'${r.id}')">✅ ${free.traum} 🌙 + ${cur.cost - free.traum} ${r.emoji}</button>`;
        });
        html += `<p class="muted center" style="margin-top:8px">🌙 Bezahlt mit Traumland und/oder GENAU EINEM Hilfsreich:</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px">${opts || '<span class="muted">Passt gerade nicht – nur Einlagern möglich.</span>'}</div>
          <button class="btn-indigo" style="width:100%;margin-top:8px" onclick="freshKeep(${cur.id})">📥 Diese einlagern (gratis)</button>`;
      } else {
        const playable = cardPlayable(cur, s.players[s.you]);
        html += `<div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn-green" style="flex:1" ${playable ? "" : "disabled"} onclick="freshPlay(${cur.id})">✅ Diese ausspielen</button>
            <button class="btn-indigo" style="flex:1" onclick="freshKeep(${cur.id})">📥 Diese einlagern (gratis)</button>
          </div>
          ${playable ? "" : `<p class="muted center" style="margin-top:6px">Passt gerade nicht – du kannst die Karte nur gratis einlagern.</p>`}`;
      }
    } else {
      html += `<button class="btn-amber" style="width:100%;margin-top:8px" onclick="freshClear()">✅ Alles klar</button>`;
    }
    html += `</div>`;
  }
  // 2er-Regeln: eigene Hand erst nach der Übergabe wieder sichtbar
  if (s.phase === "draft" && s.mode === "langsam" && s.players.length === 2 && !s.hand.length && s.awaitDiscard !== s.you) {
    const other = s.players[1 - s.you];
    html += `<div class="card-panel"><div class="label">⏳ Deine neue Hand kommt gleich…</div>
      <p class="muted center">${esc(other.name)} wählt gerade eine Karte und legt offen ab.<br/>Erst danach siehst du den übergebenen Stapel – vorher weiß niemand, was reinkommt.</p></div>`;
  }
  // 🚀 Turbo: eigene Hand ist leer, die anderen spielen noch
  if (s.phase === "draft" && s.mode === "turbo" && !s.hand.length && !s.turboDiscard) {
    html += `<div class="card-panel"><div class="label">⏳ Neue Karten kommen gleich…</div>
      <p class="muted center">Die anderen spielen noch – sobald ein Stapel bei dir ankommt, geht es für dich weiter.</p></div>`;
  }
  if (s.phase === "draft" && s.hand.length) {
    const pickDiscard = s.mode === "schnell" && !!simSel && s.players.length === 2 && s.hand.length > 1;
    const canPickHand = s.awaitDiscard === s.you || s.turboDiscard
      || (s.mode === "turbo" && !s.turboDiscard)
      || ((s.mode === "schnell" || s.mode === "langsam") && !s.mySimPick && !freshBusy && s.showTurn < 0);
    const handLabel = s.awaitDiscard === s.you || s.turboDiscard
      ? "🗑️ Wähle 1 Karte, die OFFEN aus dem Spiel abgelegt wird – alle sehen sie!"
      : pickDiscard
        ? "🗑️ JETZT die ABWURFKARTE antippen – sie wird OFFEN abgelegt (alle sehen sie)!"
        : (s.mode === "schnell" || s.mode === "langsam")
          ? `${s.mode === "langsam" ? "🐢" : "⚡"} Deine Hand (${s.hand.length} Karten) – wähle verdeckt!`
          : `Deine Hand (${s.hand.length} Karten)`;
    html += `<div class="card-panel"><div class="label">${handLabel}</div><div class="grid4">${
      s.hand.map((c) => cardHTML(c, {
        onClick: pickDiscard
          ? (c.id === simSel.cardId ? "simEdit()" : `simSetDiscard(${c.id})`)
          : ((s.mode === "schnell" || s.mode === "langsam")
              ? ((simSel && c.id === simSel.cardId) ? "simEdit()" : (canPickHand ? `selectCard(${c.id},'hand')` : null))
              : (canPickHand ? `selectCard(${c.id},'hand')` : null)),
        selected: (selected && selected.id === c.id) || (simSel && c.id === simSel.cardId) || (!!simDiscard && c.id === simDiscard),
      })).join("")}</div>
      ${pickDiscard ? `<p class="muted center" style="margin-top:6px">Auf eine andere Karte tippen = offene Ablage. Auf deine Wahl (gelber Rahmen) tippen = ändern.</p>` : ""}
    </div>`;
  }
  // ⚡/🐢 Zusammenfassung der verdeckten Wahl + Fertig-Button
  if ((s.mode === "schnell" || s.mode === "langsam") && s.phase === "draft" && simSel && !freshBusy) {
    const twoP = s.mode === "schnell" && s.players.length === 2 && s.hand.length > 1;
    const main = s.hand.find((c) => c.id === simSel.cardId);
    const dc = twoP ? s.hand.find((c) => c.id === simDiscard) : null;
    html += `<div class="card-panel" style="border:2px solid #fbbf24">
      <div class="label" style="color:#fcd34d">${s.mode === "langsam" ? "🐢" : "⚡"} Deine Wahl (verdeckt)</div>
      ${twoP && !dc ? `<div class="banner your" style="margin:0 0 8px">🗑️ Es fehlt noch die ABWURFKARTE – tippe oben in deiner Hand an, welche Karte OFFEN abgelegt wird!</div>` : ""}
      <div class="chips">
        <span class="chip chip-amber">${simSel.action === "play" ? "✅ ausspielen" : "📥 einlagern"}: ${esc(main ? main.name || realmInfo(main.realm).name : "?")}</span>
        ${twoP ? `<span class="chip">${dc ? "🗑️ offen ablegen: " + esc(dc.name || realmInfo(dc.realm).name) : "⏳ noch 1 Karte zum offenen Ablegen wählen"}</span>` : ""}
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn-green" style="flex:1" ${!twoP || dc ? "" : "disabled"} onclick="simConfirm()">✅ Fertig!</button>
        <button class="btn-ghost" style="flex:1" onclick="simEdit()">✏️ Ändern</button>
      </div>
      <p class="muted center" style="margin-top:6px">${s.mode === "langsam" ? "Sobald alle fertig sind, deckt ihr NACHEINANDER auf – jeder klickt selbst „Jetzt aufdecken!“." : "Sobald alle fertig sind, wird alles gleichzeitig aufgedeckt und ausgeführt."}</p>
    </div>`;
  }
  if (s.phase === "seasonEnd") {
    html += `<div class="card-panel"><div class="banner your" style="margin:0 0 8px">📐 Alle Karten gewählt!</div>
      <p class="muted center">${s.isYourSeasonTurn
        ? "Spiele noch Eingelagertes aus – danach „Fertig“. Am Ende wird <b>einmal für alle</b> gewürfelt."
        : "Warte kurz, bis alle fertig sind…"}</p>
      ${s.isYourSeasonTurn ? `<button class="${s.seTurn + 1 < s.players.length ? "btn-amber" : "btn-red"}" style="width:100%;margin-top:8px" onclick="seasonDone()">
        ${s.seTurn + 1 < s.players.length ? `✅ Fertig – weiter an ${esc(s.players[s.seTurn + 1].name)}` : "🎲 Jetzt einmal für alle würfeln!"}</button>` : ""}
    </div>`;
  }
  if (s.phase === "danger") html += renderDanger(s);
  if (s.phase === "reveal") html += renderReveal(s);
  html += logBox(s);
  app.innerHTML = html;
  renderActionBar();
  if (s.phase !== "draft" && s.phase !== "seasonEnd") { selected = null; }
}

window.addEventListener("load", connect);
</script>
</body>
</html>
