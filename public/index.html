// 🏅 v3.23/v3.28: Statistik-Bereich – Archiv, Bestenliste, Hall of Fame, Rekorde.
// Daten kommen per getStats vom Server (window._stats), bis dahin „Lädt…“.
// v3.27: Eigener Vollbild-Bereich vom Startbildschirm (Optionsmenü im Spiel
// zeigt denselben Inhalt als Drawer).
// v3.28 (Nutzer-Wunsch): Die Bereiche stehen UNTEREINANDER als Menü-Liste,
// jeder Klick öffnet eine EIGENE Seite (nicht aufklappbar darunter). Neu:
// Rekord-Seiten „Meiste Punkte mit Monstern“ und „Meiste Punkte mit Zielen“.
const MODE_KURZ = { langsam: "🐢", schnell: "⚡", turbo: "🚀" };
// 📋 Statistik-Hauptmenü: die Bereiche untereinander, je Klick → eigene Seite
function statsMenuHTML() {
  const eintrag = (page, emoji, titel, hinweis) => `<div class="revrow" style="cursor:pointer;padding:12px 10px" onclick="setStatsPage('${page}')">
      <span>${emoji} <b>${titel}</b><br><span class="goal">${hinweis}</span></span><span class="pts">▶</span></div>`;
  return eintrag("archiv", "📦", "Archiv", "alle gewerteten Partien, mit Klick auf die Partie die Punkte im Detail") +
    eintrag("spieler", "⭐", "Bestenliste", "Ø Punkte je Spieler, Top 10") +
    eintrag("hof", "🏆", "Hall of Fame", "beste Gesamtleistung in einer Partie") +
    eintrag("mon", "👹", "Meiste Punkte mit Monstern", "Rekordliste: Monster-Punkte in einer Partie") +
    eintrag("ziel", "🎯", "Meiste Punkte mit Zielen", "Rekordliste: Ziel-Punkte in einer Partie");
}
function statsLeaderboardHTML(st) {
  if (!st.lb || !st.lb.length) return `<p class="muted" style="margin:0 0 6px">Noch keine gewerteten ${window._statsSelSeasons === 5 ? "5er" : "4er"}-Partien – die Liste füllt sich, sobald eine ${window._statsSelSeasons === 5 ? "5er" : "4er"}-Partie mit mindestens 2 echten Menschen gewertet wird.</p>`;
  return `<div class="sub">Bestenliste (Ø Punkte, Top 10)</div>` +
    st.lb.map((e, i) => `<div class="revrow"><span><b>${i + 1}. ${esc(e.name)}</b> · ${e.spiele} ${e.spiele === 1 ? "Partie" : "Partien"} · ${e.siege} 🏆</span><span class="pts">Ø ${e.avg} SP</span></div>`).join("");
}
function statsHofHTML(st) {
  if (!st.hof || !st.hof.length) return `<p class="muted" style="margin:0 0 6px">Noch keine gewerteten ${window._statsSelSeasons === 5 ? "5er" : "4er"}-Partien – die Hall of Fame füllt sich mit der besten Einzelleistung aller Zeiten.</p>`;
  return `<div class="sub">Hall of Fame (beste Einzelleistung)</div>` +
    st.hof.map((e) => `<div class="revrow"><span><b>${esc(e.name)}</b> <span class="goal">(${esc(e.date)} · ${MODE_KURZ[e.mode] || ""} ${e.seasons} Saisons)</span></span><span class="pts">${e.punkte} SP</span></div>`).join("");
}
// 👹🎯 v3.28 (Nutzer-Wunsch): Rekordlisten für EINE Punkte-Kategorie
// (mon = Monster-Punkte, ziel = Ziel-Punkte) – je Partie die beste Leistung.
function statsKategorieHofHTML(st, key, label) {
  const list = st[key] || [];
  if (!list.length) return `<p class="muted" style="margin:0 0 6px">Noch keine gewerteten ${window._statsSelSeasons === 5 ? "5er" : "4er"}-Partien – die Rekordliste füllt sich mit der besten Leistung in einer Partie.</p>`;
  return `<div class="sub">${label}</div>` +
    list.map((e) => `<div class="revrow"><span><b>${esc(e.name)}</b> <span class="goal">(${esc(e.date)} · ${MODE_KURZ[e.mode] || ""} ${e.seasons} Saisons · insgesamt ${e.gesamt} SP)</span></span><span class="pts">${e.punkte} SP</span></div>`).join("");
}
// 📦 v3.27 (Nutzer-Wunsch): ARCHIV – alle gewerteten Partien chronologisch,
// je Partie auf einen Blick Datum, Modus, Gewinner und Mitspieler.
// Ein Klick öffnet die Detail-Ansicht mit der Punkteübersicht.
function statsArchivHTML(st) {
  const games = st.archiv || st.recent || [];
  if (!games.length) return `<p class="muted" style="margin:0 0 6px">Noch keine gewerteten Partien – das Archiv füllt sich, sobald eine Partie mit mindestens 2 echten Menschen gewertet wird.</p>`;
  return games.map((g, i) => {
    const names = (g.players || []).slice().sort((a, b) => (a.rank || 99) - (b.rank || 99)).map((p) => `${p.bot ? "🤖 " : ""}${esc(p.name)}`).join(", ");
    return `<div class="revrow" style="cursor:pointer" onclick="openStatsDetail(${i})">
        <span><b>${esc(g.date)}</b> · ${MODE_KURZ[g.mode] || ""} ${g.seasons} ${g.seasons === 1 ? "Saison" : "Saisons"}<br>
        ${g.winner ? `${g.winner.bot ? "🤖" : "🏅"} <b>${esc(g.winner.name)}</b> gewinnt` : "—"} <span class="goal">${esc(names)}</span></span>
        <span class="pts">▶</span>
      </div>`;
  }).join("");
}
// 📦 Detail einer Archiv-Partie: Platzierung + volle Punkteübersicht je Spieler
function statsDetailHTML(st, idx) {
  const games = st.archiv || st.recent || [];
  const g = games[idx];
  if (!g) return `<p class="muted" style="margin:0 0 6px">Partie nicht gefunden.</p>`;
  const rows = (g.players || []).slice().sort((a, b) => (a.rank || 99) - (b.rank || 99)).map((p) => {
    const medal = p.rank === 1 ? "🏅" : p.rank === 2 ? "🥈" : p.rank === 3 ? "🥉" : `${p.rank}.`;
    const det = [];
    if (p.mon != null) det.push(`👹 ${p.mon}`);
    if (p.ziel != null) det.push(`🎯 ${p.ziel}`);
    if (p.tro != null) det.push(`🏆 ${p.tro}`);
    if (p.coins != null) det.push(`🪙 ${p.coins}`);
    if (p.jagd != null) det.push(`🏹 ${p.jagd}`);
    if (p.kredit) det.push(`🏦 ${p.kredit}`);
    if (p.monster != null) det.push(`🎪 ${p.monster}`);
    return `<div class="revrow"><span><b>${medal} ${p.bot ? "🤖 " : ""}${esc(p.name)}</b>${det.length ? `<br><span class="goal">${det.join(" · ")}</span>` : ""}</span><span class="pts">${p.total != null ? p.total : p.punkte} SP</span></div>`;
  }).join("");
  return `<div style="display:flex;align-items:center;gap:8px;margin:0 0 8px">
      <button class="btn-ghost" style="font-size:.8rem;padding:4px 10px" onclick="closeStatsDetail()">← Archiv</button>
      <b>${esc(g.date)}</b> <span class="goal">${MODE_KURZ[g.mode] || ""} ${g.seasons} ${g.seasons === 1 ? "Saison" : "Saisons"}</span>
    </div>` + rows +
    `<div class="sub" style="margin-top:8px">👹 Monster · 🎯 Ziele · 🏆 Trophäen · 🪙 Kronen · 🏹 Jägermarker · 🏦 Kredite (−5 SP je Kredit) · 🎪 Monster in der Menagerie</div>`;
}
function drawerStatsHTML(s) {
  return `<div class="drawer ${openDrawer === "dStats" ? "open" : ""}" id="dStats"><h4>🏅 Statistiken &amp; Bestenliste <small> aller Räume</small></h4>${statsBodyHTML()}</div>`;
}
// 🏅 v3.28: Inhalt des Statistik-Bereichs – HAUPTMENÜ mit den Bereichen
// untereinander; jeder Bereich öffnet eine EIGENE Seite mit ←-Zurück-Button.
// Bestenliste, Hall of Fame und die Rekordlisten bleiben nach 4er/5er-Partien
// getrennt (5er-Partien punkten im Schnitt höher).
function statsBodyHTML() {
  const st = window._stats || null;
  if (!st) return `<p class="muted" style="margin:0 0 6px">Lädt…</p>`;
  const seitenKopf = (titel) => `<div style="display:flex;align-items:center;gap:8px;margin:0 0 10px">
      <button class="btn-ghost" style="font-size:.8rem;padding:4px 10px" onclick="setStatsPage(null)">← Statistik</button>
      <b>${titel}</b>
    </div>`;
  const fusszeile = `<p class="muted" style="margin:10px 0 0;font-size:.7rem">${st.total || 0} gewertete ${st.total === 1 ? "Partie" : "Partien"} · dauerhaft gespeichert${st.firebase ? " (Firebase)" : " – bis zum Server-Neustart (Firebase noch nicht eingerichtet)"} · zählt nur Partien mit mindestens 2 echten Menschen</p>`;
  const page = window._statsPage || null;
  if (!page) return statsMenuHTML() + fusszeile;
  if (page === "archiv") {
    if (window._statsDetail != null && window._statsDetail >= 0) return seitenKopf("📦 Archiv") + statsDetailHTML(st, window._statsDetail) + fusszeile;
    return seitenKopf("📦 Archiv") + statsArchivHTML(st) + fusszeile;
  }
  const sel = window._statsSelSeasons === 5 ? 5 : 4;
  const sec = st.bySeasons ? (st.bySeasons[sel] || { lb: [], hof: [], monHof: [], zielHof: [] }) : { lb: [], hof: [], monHof: [], zielHof: [] };
  const umschalter = `<div style="display:flex;gap:8px;margin:0 0 8px">
      <button class="${sel === 4 ? "btn-amber" : "btn-ghost"}" style="flex:1;font-size:.85rem" onclick="setStatsSeasons(4)">4 Saisons</button>
      <button class="${sel === 5 ? "btn-amber" : "btn-ghost"}" style="flex:1;font-size:.85rem" onclick="setStatsSeasons(5)">5 Saisons</button>
    </div>`;
  if (page === "spieler") return seitenKopf("⭐ Bestenliste") + umschalter + statsLeaderboardHTML(sec) + fusszeile;
  if (page === "hof") return seitenKopf("🏆 Hall of Fame") + umschalter + statsHofHTML(sec) + fusszeile;
  if (page === "mon") return seitenKopf("👹 Meiste Punkte mit Monstern") + umschalter + statsKategorieHofHTML(sec, "monHof", "Monster-Rekorde (beste Einzelleistung)") + fusszeile;
  if (page === "ziel") return seitenKopf("🎯 Meiste Punkte mit Zielen") + umschalter + statsKategorieHofHTML(sec, "zielHof", "Ziel-Rekorde (beste Einzelleistung)") + fusszeile;
  return statsMenuHTML() + fusszeile;
}
window.setStatsSeasons = (n) => { window._statsSelSeasons = n === 5 ? 5 : 4; render(); };
// 📌 v3.28: Seiten-Navigation im Statistik-Bereich (null = Hauptmenü)
window.setStatsPage = (p) => {
  window._statsPage = ["archiv", "spieler", "hof", "mon", "ziel"].includes(p) ? p : null;

};
window.openStatsDetail = (i) => { window._statsDetail = i; render(); };
window.closeStatsDetail = () => { window._statsDetail = null; render(); };
// 🚪 v3.27: Der Startbildschirm-Button führt in einen EIGENEN
// Statistik-Bereich (voller Bildschirm statt Aufklapp-Panel). Name und Raum-
// Code bleiben beim Zurückkehren zum Startbildschirm erhalten.

window.showStats = () => {
  const open = openDrawer === "dStats";
  openDrawer = open ? null : "dStats";
  // 🃏 v3.29 (Nutzer-Regel): Der Zieh-Schleier bleibt auch hier auf, solange
  // eine gezogene Nicht-Ziel-Karte noch nicht entschieden ist.
  const freshZwang = state && (state.freshDraw || []).some((c) => c.type !== "Ziel");
  document.querySelectorAll(".drawer.open, .freshov.open").forEach((x) => { if (freshZwang && x.id === "dFresh") return; x.classList.remove("open"); });

    window._statsPage = null; // beim Öffnen immer das Statistik-Hauptmenü (v3.28)
    window._statsDetail = null;
    const d = document.getElementById("dStats");
    if (d) d.classList.add("open");
  }
  if (!open) send({ t: "getStats" }); // beim Öffnen immer frisch laden
};

// ---------------------------- Wechsel-Schirme & 2er-Infos ---------------
function mitteHTML(s) {
  let html = turnBanner(s);
  if (s.phase === "draft" && s.players.length === 2) {
    const chips = (s.openDiscards || []).map((d) =>
      `<span class="chip" style="background:rgba(249,115,22,0.18);color:#fdba74">${esc(s.players[d.by].name)}: ${esc(d.card.name)}${d.card.type === "Monster" ? " ⭐" + d.card.points : d.card.type === "Land" ? " +" + d.card.level : ""}</span>`).join("");
    html += `<div class="card-panel"><div class="label">🗑️ Offene Ablage · Nachziehstapel: ${s.stackCount || 0} Karten verdeckt</div>
      <div class="chips">${chips || '<span class="muted">Noch nichts offen abgelegt.</span>'}</div></div>`;
  }
  if (s.phase === "draft" && s.mode === "langsam" && s.players.length === 2 && !s.hand.length && s.awaitDiscard !== s.you) {
    const other = s.players[1 - s.you];
    html += `<div class="card-panel"><div class="label">⏳ Deine neue Hand kommt gleich…</div>
      <p class="muted center">${esc(other.name)} wählt gerade eine Karte und legt offen ab.<br/>Erst danach siehst du den übergebenen Stapel – vorher weiß niemand, was reinkommt.</p></div>`;
  }
  if (s.phase === "draft" && s.mode === "turbo" && !s.hand.length && !s.turboDiscard) {
    html += `<div class="card-panel"><div class="label">⏳ Neue Karten kommen gleich…</div><p class="muted center">Die anderen spielen noch – sobald ein Stapel bei dir ankommt, geht es für dich weiter.</p></div>`;
  }
  // 🪶 v3.4: Am Saisonende KEIN Extra-Kasten mehr – das Banner oben und der
  // „Fertig“-Knopf im Aktionsband genügen (Nutzer-Wunsch: deutlich weniger Text).
  if (s.phase === "danger") html += renderDanger(s);
  if (s.phase === "reveal") html += renderReveal(s);
  return html;
}

// ---------------------------- Der Spieltisch ----------------------------
function phoneShellHTML(s) {
  // 🃏 v3.15/v3.29 (Nutzer-Regel): Der Zieh-Schleier bleibt offen, bis JEDE
  // gezogene Nicht-Ziel-Karte ENTSCHIEDEN ist (ausspielen/einlagern/anstellen).
  // Vor v3.29 war nur der Flip erzwungen – danach ließ sich der Schleier
  // zuklicken und die Karte wartete unsichtbar ohne Entscheidung (verboten!).
  // Gezogene ZIELE blockieren weiterhin nichts (einmal ansehen genügt).
  const wartet = (s.freshDraw || []).some((c) => c.type !== "Ziel");
  if (wartet || (FX && (FX.freshNeu || []).length)) openDrawer = "dFresh";
  if (!(s.phase === "draft" && s.hand && s.hand.length)) inhand = false;
  // v3.13: Nach „Fertig“ im 🐢-Modus liegt die eigene Hand ab (freie Sicht).
  const simdone = s.mode === "langsam" && s.phase === "draft" && window._simSent
    && !window._simEditing && !!s.hand && s.hand.length > 0;
  // 🎨 v3.20: Saison-Hauch – die Saison-Karte färbt den Tisch oben dezent ein.
  const saisonCls = s.seasonCard ? " saison-" + s.seasonCard : "";
  return `<div class="phone${inhand ? " inhand" : ""}${simdone ? " simdone" : ""}${saisonCls}" id="phone">`
    + saisonHeadHTML(s)
    + `<div class="spieler" id="spielerBox">${spielerBoxHTML(s)}</div>`
    + `<div class="mitte">${mitteHTML(s)}</div>`
    + `<div class="uiband"><div class="info" id="info"></div></div>`
    + handwrapHTML(s)
    + landsStripHTML(s)
    + drawerMenHTML(s)
    + drawerLagerHTML(s)
    + drawerEigenHTML(s)
    + drawerFreshHTML(s)
    + drawerChatHTML(s)
    + drawerSaisonHTML(s)
    + drawerStatsHTML(s)
    + bottombarHTML(s)
    + menuHTML(s)
    + `</div>`;
}

function render() {
  if (!state) { renderConnect(); return; }
  if (state.phase === "lobby") { actionBar.style.display = "none"; renderLobby(state); return; }
  // v2.8: Geister-Wahl abscheiden. Der Server führt ⚡-Runden sofort aus, sobald
  // ALLE gewählt haben (Bots tippen blitzschnell), rotiert die Hände und setzt
  // die Wahl zurück. Der Client zeigte aber die gestufte Wahl („✅ Fertig!“ /
  // „✏️ Ändern“) einfach WEITER an – für eine Karte, die gar nicht mehr auf der
  // Hand liegt. Klick darauf lief ins Leere bzw. der Server antwortete mit
  // „Karte nicht gefunden“. Merkregel: Liegt die gestufte/gewählte Karte nicht
  // mehr auf der Hand, ist die Runde längst ausgeführt -> Zustand zurücksetzen
  // statt toter Buttons. (Vor dem Server-Echo ist das sicher: die Karte verlässt
  // die Hand NUR durch die eigene, bereits abgeschickte Wahl.)
  if (state.phase === "draft" && Array.isArray(state.hand)) {
    if (simSel && !state.hand.some((c) => c.id === simSel.cardId)) { simSel = null; simDiscard = null; window._simSent = false; }
    else if (simDiscard != null && !state.hand.some((c) => c.id === simDiscard)) simDiscard = null;
    if (selected && selectedFrom === "hand" && !state.hand.some((c) => c.id === selected.id)) {
      selected = null; selectedFrom = null; window._realm = null;
    }
  }
  FX = computeFx(fxPrev, state); // ✨ v3.8: Animations-Deltas
  app.innerHTML = phoneShellHTML(state);
  renderActionBar();
  bindFan();
  fxAfter(FX, state);  // ✨ v3.8: Münzflug + Gedächtnis
  fxPrev = fxSnapshot(state);
  if (state.phase !== "draft" && state.phase !== "seasonEnd") { selected = null; }
}

// ---------------------------- ✨ v3.8 Animationen -----------------------------
// fxSnapshot/computeFx vergleichen den Zustand vor und nach einem Server-Update
// und leiten daraus ab, was animiert werden soll. fxAfter startet die Effekte
// (Münzflug) und aktualisiert das Gedächtnis der schon gezeigten Zieh-Karten.
function fxSnapshot(s) {
  return {
    you: s.you,
    phase: s.phase,
    gameId: s.gameId || 0,
    coins: s.players.map((p) => p.coins || 0),
    hunters: s.players.map((p) => p.hunters || 0),
    lands: s.players.map((p) => Object.assign({}, p.lands)),
    monN: s.players.map((p) => (p.seasonMonsters || []).length),
    stfN: s.players.map((p) => (p.staff || []).length),
    logHead: (s.log && s.log[0]) || "",
    handLen: (s.hand || []).length,
  };
}
function computeFx(prev, s) {
  const fx = { myCoinGain: 0, coinGain: [], coinLoss: [], huntGain: [], landNeu: [], freshNeu: [], handAnkunft: false, newMon: [], newStf: [], opFX: [], startCoins: false };
  fx.freshNeu = (s.freshDraw || []).filter((c) => !window._seenFresh || !window._seenFresh[c.id]).map((c) => c.id);
  // ✨ v3.13: SPIELSTART – jeder Spieler bekommt seine 4 Start-Kronen als
  // Münz-Flug (Nutzer-Wunsch). Ein neues Spiel hat eine neue gameId; bei einem
  // Wechsel (oder dem allerersten Spielzustand nach der Lobby) fliegt es genau 1x.
  if (prev && (prev.gameId || 0) !== (s.gameId || 0)) window._startCoinsShown = false;
  if (!window._startCoinsShown && s.phase === "draft" && s.season === 0
      && (s.hand || []).length >= 7 && (!prev || (prev.gameId || 0) !== (s.gameId || 0))) {
    window._startCoinsShown = true;
    fx.startCoins = true;
  }
  if (prev && s && Array.isArray(s.players) && prev.coins.length === s.players.length && prev.you === s.you) {
    if (prev.handLen === 0 && (s.hand || []).length > 0 && s.phase === "draft") fx.handAnkunft = true;
    // ✨ v3.10: Gespielte Monster/Mitarbeiter – auch über den draft→seasonEnd-
    // Übergang (dort darf noch Eingelagertes gespielt werden). Beim Saison-Reset
    // schrumpfen die Arrays, Deltas sind negativ → kein Fehl-Alarm.
    if (prev.phase === s.phase || (prev.phase === "draft" && s.phase === "seasonEnd")) {
      s.players.forEach((p, i) => {
        const dm = (p.seasonMonsters || []).length - (prev.monN[i] || 0);
        const ds = (p.staff || []).length - (prev.stfN[i] || 0);
        if (dm > 0) fx.newMon[i] = dm;
        if (ds > 0) fx.newStf[i] = ds;
      });
    }
    // ✨ v3.11: Mitspieler-Aktionen aus dem öffentlichen Log: Events, Einlagern,
    // Ziele annehmen. Der Log nennt keine Kartennamen, aber die Akteure.
    if (Array.isArray(s.log) && s.log.length && prev.logHead && s.log[0] !== prev.logHead) {
      const stop = s.log.indexOf(prev.logHead);
      const newLines = s.log.slice(0, stop > 0 ? stop : 3);
      newLines.forEach((l) => {
        s.players.forEach((pl, i) => {
          if (i === s.you || typeof l !== "string" || !pl.name) return;
          if (l.startsWith(pl.name + ": ✅ Event „")) {
            const m = l.match(/Event „([^"]+)"/);
            if (m) pushOpFX(fx, i, { kind: "Event", name: m[1] });
          } else if (l.startsWith("📥 " + pl.name + " lagert eine Karte ein")) pushOpFX(fx, i, { kind: "store" });
          else if (l.startsWith("📥 " + pl.name + " nimmt ein Ziel an")) pushOpFX(fx, i, { kind: "ziel" });
        });
      });
    }
    // ✨ v3.11: Gespielte Monster/Mitarbeiter der Mitspieler aus den öffentlichen
    // Arrays ( dieselben Daten wie die Kacheln in ihren Panels).
    s.players.forEach((pl, i) => {
      if (i === s.you) return;
      const mons = pl.seasonMonsters || [];
      for (let k = fx.newMon[i] || 0; k > 0; k--) pushOpFX(fx, i, { kind: "Monster", card: mons[mons.length - k] });
      const stfs = pl.staff || [];
      for (let k = fx.newStf[i] || 0; k > 0; k--) pushOpFX(fx, i, { kind: "Mitarbeiter", card: stfs[stfs.length - k] });
    });
    // Münz-/Land-Effekte nur innerhalb einer Phase: Übergänge (Saison-Ende,
    // neue Runde, Aufräumen) setzen Punkte zurück, das wäre irreführendes Flackern.
    if (prev.phase === s.phase) {
      s.players.forEach((p, i) => {
        const d = (p.coins || 0) - (prev.coins[i] || 0);
        if (d > 0) { fx.coinGain[i] = d; if (i === s.you) fx.myCoinGain = d; }
        if (d < 0) fx.coinLoss[i] = -d;    // 🪙 v3.9: Kronen-Abgang (Bezahlen)
        const dh = (p.hunters || 0) - (prev.hunters[i] || 0);
        if (dh > 0) fx.huntGain[i] = dh;   // 🏹 v3.9: Jägermarker dazu
        const pl = prev.lands[i] || {};
        for (const r of ALL_REALMS) {
          if ((p.lands[r.id] || 0) > (pl[r.id] || 0)) { fx.landNeu[i] = r.id; break; }
        }
      });
    }
  }
  return fx;
}
function fxAfter(fx, s) {
  // Gedächtnis: merken, welche Zieh-Karten schon einmal geflippt wurden
  // (der gleiche Kartenstapel wird bei jedem render() neu gezeichnet).
  const seen = {};
  (s.freshDraw || []).forEach((c) => { seen[c.id] = true; });
  window._seenFresh = seen;
  if (!fx) return;
  if (fx.myCoinGain > 0) flyCoins(Math.min(fx.myCoinGain, 6));
  // 🏹🪙 v3.9: Jägermarker-Flug für ALLE Spieler + Kronen-Abgang beim Bezahlen
  s.players.forEach((p, i) => {
    if (fx.huntGain[i]) flyMark(Math.min(fx.huntGain[i], 6), i === s.you ? "huntMe" : "huntP" + i);
    const loss = fx.coinLoss[i] || 0;
    if (loss > 0) flySpend(Math.min(loss, i === s.you ? 6 : 3), i === s.you ? "crownMe" : "coinP" + i);
  });
  // ✨ v3.13: Spielstart-Tamtam – die 4 Start-Kronen fliegen zu JEDEM Spieler.
  if (fx.startCoins) {
    s.players.forEach((p, i) => {
      setTimeout(() => flyBadges(4, i === s.you ? "crownMe" : "coinP" + i, "coinfly", "", false), 220 + i * 240);
    });
  }
  // ✨ v3.11: Der eigene Spiel-Blitz ist WEG (Nutzer-Wunsch). Dafür: kleine
  // Version der gespielten Karte im Mitspieler-Panel, und beim Einlagern /
  // Ziel-Annehmen verschwindet eine verdeckte Karte am Bildschirmrand dort.
  if (fx.opFX) {
    s.players.forEach((pl, i) => {
      const q = fx.opFX[i];
      if (i === s.you || !q || !q.length) return;
      q.forEach((item, k) => spawnOpFX(i, item, k));
    });
  }
}
// ✨ v3.10: Eigene gespielte Karte groß in der Mitte – dreht sich rein,
// leuchtet kurz golden auf und verblasst (nicht blockierend, pointer-events:none).
function pushOpFX(fx, pi, item) {
  if (!fx.opFX) fx.opFX = [];
  if (!fx.opFX[pi]) fx.opFX[pi] = [];
  if (fx.opFX[pi].length < 4) fx.opFX[pi].push(item);
}

// ✨ v3.11: Mitspieler-Aktion im Panel: kleine Version der gespielten Karte
// (Monster/Mitarbeiter/Event) - bzw. verdeckte ?-Karte, die in das Panel des
// Mitspielers hinein verschwindet (Einlagern / Ziel-Annehmen).
// ✨ v3.12 (Nutzer-Wunsch): Beide sehen IDENTISCH aus (immer ?-Rückseite, nie 🎯 –
// im Original weiß niemand, was da eingelagert wurde) und der Flug startet in
// der TISCHMITTE wie bei Münzen & Jägermarkern – vom Bildschirmrand sah es im
// 3er-Modus nämlich aus wie ein Kartentausch zwischen Mitspielern.
function spawnOpFX(pi, item, k) {
  const host = document.querySelector(`.spanel[data-pi="${pi}"]`) || document.getElementById("coinP" + pi);
  if (!host || !host.getBoundingClientRect) return;
  const r = host.getBoundingClientRect();
  const vw = window.innerWidth || 400;
  const del = k * 650;
  if (item.kind === "store" || item.kind === "ziel") {
    const el = document.createElement("div");
    el.className = "opfx";
    el.innerHTML = `<div style="--ch:110px; --cw:calc(110px*.667); --rc:#2b3860; filter:drop-shadow(0 14px 30px #000c)">
      <div class="k rueck"><div class="rueckm"><div class="rc1">?</div></div></div></div>`;
    document.body.appendChild(el);
    const w = 74, h = 110;
    // v3.12: Start in der Tischmitte (Zentrum des Spielfelds bei 45 % Höhe,
    // exakt wie flyBadges für Münzen/Jägermarker) – nicht mehr am Rand.
    const ph = document.getElementById("phone");
    const pr = (ph && ph.getBoundingClientRect) ? ph.getBoundingClientRect() : null;
    const cx = (pr && pr.width) ? pr.left + pr.width / 2 : vw / 2;
    const cy = (pr && pr.width) ? pr.top + pr.height * 0.45 : (window.innerHeight || 760) * 0.45;
    const endX = Math.min(Math.max(r.left + r.width / 2 - w / 2, 8), Math.max(8, vw - w - 8));
    const endY = Math.max(64, r.top - 12);
    const anim = el.animate([
      { transform: `translate(${cx - w / 2}px, ${cy - h / 2}px) scale(.4) rotate(14deg)`, opacity: 0 },
      { transform: `translate(${cx * 0.35 + endX * 0.65 - 26}px, ${cy * 0.3 + endY * 0.7 - 34}px) scale(1) rotate(5deg)`, opacity: 1, offset: .45 },
      { transform: `translate(${endX}px, ${endY}px) scale(1) rotate(0deg)`, opacity: 1, offset: .8 },
      { transform: `translate(${endX}px, ${(endY + 18)}px) scale(.15)`, opacity: 0 }
    ], { duration: 1600, delay: del, easing: "cubic-bezier(.25,.4,.5,1)", fill: "both" });
    anim.onfinish = () => el.remove();
    setTimeout(() => { if (el.parentNode) el.remove(); }, 1600 + del + 400);
    return;
  }
  const cardish = item.kind === "Event"
    ? { id: -1, type: "Event", name: item.name }
    : Object.assign({ id: -1, type: item.kind }, item.card);
  const el = document.createElement("div");
  el.className = "opfx";
  el.innerHTML = `<div style="--ch:132px; --cw:calc(132px*.667); filter: drop-shadow(0 14px 30px #000c) drop-shadow(0 0 18px rgba(233,199,102,.4))">
    ${fanCardHTML(cardish, { noClick: true })}</div>`;
  document.body.appendChild(el);
  const w = 88, h = 132;
  const x = Math.min(Math.max(r.left + r.width / 2 - w / 2, 8), Math.max(8, vw - w - 8));
  const y = Math.max(60, r.top - 14);
  const anim = el.animate([
    { transform: `translate(${x}px, ${(y + 20)}px) scale(.5)`, opacity: 0 },
    { transform: `translate(${x}px, ${y}px) scale(1)`, opacity: 1, offset: .16 },
    { transform: `translate(${x}px, ${y}px) scale(1)`, opacity: 1, offset: .8 },
    { transform: `translate(${x}px, ${(y - 26)}px) scale(.92)`, opacity: 0 }
  ], { duration: 2100, delay: del, easing: "cubic-bezier(.25,.4,.5,1)", fill: "both" });
  anim.onfinish = () => el.remove();
  setTimeout(() => { if (el.parentNode) el.remove(); }, 2100 + del + 400);
}
function flyBadges(n, targetId, cls, inner, weg) {
  // ✨ v3.9: Generalisierter Effekt-Flug – Münzen hin (weg=false), Münzen weg
  // beim Bezahlen (weg=true), Jägermarker-Flug (cls="huntfly", inner="🏹").
  // Bewusst OHNE „prefers-reduced-motion“-Check: Der Nutzer will die Animationen
  // auch dann sehen, wenn sein Handy „Animationen reduzieren“ aktiviert hat.
  const phone = document.getElementById("phone");
  const tgt = document.getElementById(targetId);
  if (!phone || !tgt) return;
  const pr = phone.getBoundingClientRect(), tr = tgt.getBoundingClientRect();
  if (!pr || !tr || !pr.width) return;
  const cx = pr.left + pr.width / 2, cy = pr.top + pr.height * 0.45;
  const tx = tr.left + tr.width / 2, ty = tr.top + tr.height / 2;
  const ax = weg ? tx : cx, ay = weg ? ty : cy;
  const bx = weg ? cx : tx, by = weg ? cy : ty;
  const dx = bx - ax, dy = by - ay;
  const off = cls === "huntfly" ? 11 : 10;
  for (let j = 0; j < n; j++) {
    const c = document.createElement("div");
    c.className = cls;
    c.style.left = (ax - off) + "px";
    c.style.top = (ay - off) + "px";
    if (inner) c.innerHTML = inner;
    document.body.appendChild(c);
    const anim = c.animate(
      [
        { transform: "translate(0,0) scale(" + (weg ? 1 : .4) + ")", opacity: weg ? 1 : 0 },
        { transform: "translate(" + (dx * 0.18 - 26) + "px," + (dy * 0.25 - 34) + "px) scale(1)", opacity: 1, offset: 0.45 },
        { transform: "translate(" + dx + "px," + dy + "px) scale(" + (weg ? .4 : .55) + ")", opacity: weg ? 0 : 0.9 },
      ],
      { duration: 620, delay: j * 90, easing: "cubic-bezier(.35,.6,.4,1)" }
    );
    anim.onfinish = () => { if (c.parentNode) c.parentNode.removeChild(c); };
    setTimeout(() => { if (c.parentNode) c.parentNode.removeChild(c); }, 900 + n * 90);
  }
}
function flyCoins(n) { flyBadges(n, "crownMe", "coinfly", "", false); }
function flyMark(n, targetId) { flyBadges(n, targetId, "huntfly", "🏹", false); }
function flySpend(n, targetId) { flyBadges(n, targetId, "coinfly", "", true); }
