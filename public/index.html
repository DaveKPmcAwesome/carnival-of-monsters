<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Carnival of Monsters – Online</title>
<style>
  /* ===== UI-Übernahme des Prototyps (v2.0) – dunkler Comic-Tisch · Feinschliff v3.4 ===== */
  :root { --gold:#e9c766; --bg:#0f172a; --panel:#1e2a42; --line:#31405f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body { min-height: 100dvh; background:#070d1a; color:#e2e8f0; font-family:system-ui,-apple-system,sans-serif; overscroll-behavior:none; }
  /* v3.3: Karten sind <button>s – ohne eigenes color setzten Android/PC die
     Browser-Standardfarbe (schwarz) an, nur iOS erbt das Blau des Bodys.
     color:inherit gleicht alle Geräte an den iOS-Look an. */
  button { font-family: inherit; color: inherit; cursor: pointer; }
  input { font-family: inherit; }
  button:disabled { opacity: .5; cursor: default; }

  #status { position:fixed; top:0; left:0; right:0; z-index:300; background:#dc2626; color:#fff; font-weight:700; font-size:.85rem; padding:10px 14px; display:none; }
  #toast { position:fixed; bottom:130px; left:50%; transform:translateX(-50%); background:#16a34a; color:#fff; font-weight:700; font-size:.9rem; padding:10px 18px; border-radius:999px; box-shadow:0 6px 18px #000a; display:none; z-index:260; pointer-events:none; max-width:92%; text-align:center; }

  /* Spieltisch: das „Handy“-Panel */
  .phone { width:100%; max-width:430px; margin:0 auto; background:var(--bg); height:100dvh; display:flex; flex-direction:column; position:relative; overflow:hidden; padding-bottom:124px;
           --ch:250px; --cw:calc(var(--ch)*.667); }
  .phone.inhand { --ch:min(48dvh,380px); --cw:calc(var(--ch)*.667); }

  /* ---- Kopf: Saison-Symbol mit Richtungspfeil-Ring + Reichs-Lampen ---- */
  .top { display:flex; align-items:center; gap:10px; padding:10px 12px 4px; }
  .sicon { width:40px; height:40px; border-radius:50%; background:#17607e; display:flex; align-items:center; justify-content:center; font-size:19px; flex:0 0 40px; position:relative; }
  .sicon .pfeil { position:absolute; left:-5px; top:-5px; width:50px; height:50px; pointer-events:none; display:block; }
  .sicon .pfeil .bogen { fill:none; stroke-width:3.4; }
  .sicon .pfeil .spitze {  }
  .sicon.ccw .pfeil { transform:scaleX(-1); }
  .season { flex:1; display:flex; align-items:center; justify-content:center; }
  .lamps { display:flex; gap:10px; justify-content:center; }
  .lamp { width:15px; height:15px; border-radius:50%; background:#243452; border:1px solid #31405f; }
  .lamp.on { background:var(--lc,#e9c766); border-color:transparent; box-shadow:0 0 6px #0008; }
  .lamp.cur { background:var(--lc,#e9c766); border-color:#fff8; box-shadow:0 0 11px var(--lc,#e9c766); animation:cm-pulse 1.5s infinite; }
  @keyframes cm-pulse { 50% { box-shadow:0 0 4px var(--lc,#e9c766); } }
  .menu { width:36px; height:36px; border-radius:50%; background:var(--panel); display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:1.15rem; flex:0 0 36px; cursor:pointer; }

  /* ---- Drei-Punkte-Optionen ---- */
  .optionen { position:fixed; top:54px; right:calc(max(50% - 215px, 12px)); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:5px; z-index:45; display:none; box-shadow:0 10px 30px #000c; width:230px; max-height:calc(100dvh - 70px); overflow-y:auto; }
  .optionen.open { display:block; }
  .optitem { display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none; color:#e2e8f0; font-size:.88rem; font-weight:600; padding:11px 12px; border-radius:10px; }
  .optitem:active { background:#31405f; }
  .optitem small { color:#64748b; font-weight:400; }

  /* ---- Mitspieler-Panels im Sitz-Kreis ---- */
  .spieler { display:flex; flex-direction:column; gap:6px; padding:6px 12px 2px; }
  .srow { display:flex; gap:8px; }
  .srow .spanel { flex:1 1 0; min-width:0; }
  .srow.oben { padding:0 34px; }
  .srow.unten { gap:40px; }
  .srow.solo { justify-content:center; }
  .srow.solo .spanel { flex:0 1 76%; }
  .srow.oben .kopf { flex-wrap:wrap; row-gap:2px; }
  .srow.oben .kenn { flex-basis:100%; margin-left:0; padding-left:36px; }
  .srow.oben .pf { display:none; }
  .spanel { background:var(--panel); border-radius:12px; padding:8px 10px; overflow:hidden; position:relative; cursor:pointer; }
  .kopf { display:flex; align-items:center; gap:8px; }
  .pav { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.74rem; background:#0e2a3d; border:2px solid #3f9ac2; flex:0 0 28px; color:#fff; }
  .pname { font-size:.9rem; font-weight:700; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pname small { display:block; font-weight:400; color:#94a3b8; font-size:.62rem; }
  .dot { width:14px; height:14px; border-radius:50%; border:1px solid #000a; flex:0 0 14px; }
  .dot.on { box-shadow:0 0 8px #fff7; border-color:#fff9; }
  /* v2.7: Der alte Einheits-Abdunkel-Filter machte aus den gelben Wolkenlanden
     ein dunkles Braun (fast wie Höhlenlande). Belegte Punkte bekommen jetzt
     je Reich ihre eigene Abdunkel-Farbe direkt im HTML (realmOffColor). */
  .landrows { margin-top:9px; }
  .lrow { display:flex; align-items:center; gap:5px; margin:5px 0; flex-wrap:wrap; max-width:calc(5*14px + 4*5px); }
  .spanel.rechts .lrow { flex-direction:row-reverse; margin-left:auto; }
  .kenn { display:flex; gap:10px; margin-left:auto; font-size:.74rem; color:#cbd5e1; white-space:nowrap; flex-shrink:0; }
  .kenn b { color:#fff; }
  .spanel .saison-lab, .spanel .minis, .spanel .staffbox { display:none; }
  .spanel.auf .saison-lab, .spanel.auf .minis, .spanel.auf .staffbox { display:block; }
  .spanel.auf .minis { display:flex; }
  .spanel.auf { z-index:52; box-shadow:0 12px 32px #000d; }
  .pf { color:#64748b; font-size:.72rem; flex:0 0 auto; transition:transform .2s; }
  .spanel.auf .pf { transform:rotate(90deg); color:#cbd5e1; }
  .saison-lab { font-size:.66rem; color:#94a3b8; margin:8px 0 5px; }
  .minis { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
  .minis::-webkit-scrollbar { display:none; }
  .mini { flex:0 0 72px; height:94px; border-radius:10px; border:3px solid var(--rc,#888); background:#101b2e; position:relative; text-align:center; padding-top:7px; font-size:.58rem; line-height:1.2; }
  .mini .me { font-size:23px; }
  .mini .st { position:absolute; bottom:3px; left:50%; transform:translateX(-50%); font-size:.6rem; font-weight:800; color:#fde68a; white-space:nowrap; }
  .staffbox { margin-top:8px; }

  /* ---- Mitte (Hinweis-Banner & Wechsel-Schirme) ---- */
  .mitte { flex:1; min-height:0; overflow-y:auto; padding:2px 12px; }
  .banner { border-radius:14px; padding:10px 14px; margin-bottom:10px; text-align:center; font-weight:800; font-size:.9rem; }
  .banner.your { background:rgba(245,158,11,.18); border:1px solid rgba(245,158,11,.5); color:#fcd34d; }
  .banner.wait { background:rgba(255,255,255,.06); color:#94a3b8; font-weight:600; }
  .banner.warn { background:rgba(220,38,38,.15); border:1px solid rgba(220,38,38,.5); color:#fca5a5; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; font-size:.8rem; justify-content:center; margin-top:6px; }
  .chip { background:rgba(255,255,255,.08); border-radius:10px; padding:4px 10px; }
  .chip-amber { background:rgba(245,158,11,.2); color:#fcd34d; }
  .chip-red { background:rgba(239,68,68,.2); color:#fca5a5; }

  /* ---- Info-Zeile + Aktionsleiste ---- */
  .uiband { position:relative; z-index:35; padding:4px 10px 6px; }
  .info { text-align:center; min-height:20px; font-size:.78rem; color:#fde68a; }
  #actionbar { position:fixed; bottom:118px; left:50%; transform:translateX(-50%); width:100%; max-width:430px; z-index:46; padding:6px 10px 8px; background:#0b1424f0; border-top:1px solid var(--line); }
  #actionbar .inner { display:flex; flex-wrap:wrap; gap:8px; }
  #actionbar .note { flex-basis:100%; text-align:center; font-size:.72rem; color:#fde68a; }
  #actionbar button { flex:1 1 auto; border:none; border-radius:10px; padding:12px 6px; font-weight:800; font-size:.86rem; color:#fff; min-width:110px; }
  /* v2.5: Gold-Verlauf für Übergangs-Buttons (Nächste Saison, Aufdecken, Saisonende-Fertig) –
     derselbe Look wie in der Lobby, statt des flachen Orange.
     v2.6: plus Padding/Rundung/Größe – die Buttons sahen winzig und eckig aus,
     weil außerhalb von #actionbar/.start nirgends Button-Maße definiert waren. */
  .btn-amber { background:linear-gradient(180deg, #f3d98a, #e9c766); color:#241a07; font-weight:800;
               border:1px solid #b48a2a; box-shadow:0 6px 16px #000a;
               border-radius:12px; padding:12px 16px; font-size:.95rem; }
  .btn-green { background:#16a34a; color:#fff; }
  .btn-red { background:#dc2626; color:#fff; }
  .btn-purple { background:#7c3aed; color:#fff; }
  .btn-indigo { background:#4f46e5; color:#fff; }
  .btn-ghost { background:rgba(255,255,255,.08); color:#f1f5f9; font-weight:400; }

  /* ---- Der Kartenfächer ---- */
  .handwrap { position:absolute; left:0; right:0; bottom:64px; height:calc(var(--ch) + 16px); z-index:6;
              transform:translateY(calc(var(--ch)*.5 - 46px)); transition:transform .4s cubic-bezier(.4,1.3,.5,1); pointer-events:none; }
  .phone.inhand .handwrap { transform:translateY(-10vh); z-index:40; }
  .phone.inhand.bandhoch .handwrap { transform:translateY(calc(-10vh - 96px)); }
  .phone.inhand .uiband { z-index:45; }
  .hand { width:100%; height:100%; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .hand::-webkit-scrollbar { display:none; }
  .handin { display:flex; align-items:flex-end; height:100%; }
  .endcap { flex:0 0 calc(50% - var(--cw)/2); height:1px; transition:width .35s; }
  .k { position:relative; flex:0 0 auto; height:var(--ch); width:var(--cw);
       margin-right:calc(var(--cw)*-.45); border-radius:12px; border:4px solid var(--rc,#888); background:#101b2e; color:#e2e8f0; overflow:hidden; cursor:pointer; pointer-events:auto;
       container-type:size; transition:width .35s ease, height .35s ease, margin-right .35s ease;
       touch-action:none; -webkit-user-select:none; user-select:none; }
  .k:disabled { opacity:.45; }
  /* v2.8: Die LETZTE Karte bekommt keinen negativen rechten Außenabstand –
     sonst frisst die Fächer-Überlappung genau 45% Kartenbreite aus dem rechten
     Randpolster, und man kann nie ganz zur letzten Karte durchwischen. */
  .handin .k:last-of-type { margin-right:0; }
  .phone.inhand .k { border-width:5px; }
  .k .art { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(#ffffff08,#00000038); font-size:34cqw; }
  .k .name { position:absolute; top:5px; left:6px; right:6px; text-align:center; background:#0b1424ee; padding:2px 8px; border-radius:10px; font-weight:800; border:1px solid #ffffff26; white-space:normal; line-height:1.16; font-size:clamp(9px,6.5cqw,15px); overflow:hidden; max-height:2.4em; }
  /* v2.7: Titel zweizeilig statt seitlich abgeschnitten; bei Karten mit Kosten-
     Badge rückt der Titel nur bis zum Badge, damit nichts übereinanderligt. */
  .k:has(.med) .name { right:calc(clamp(24px,17cqw,44px) + 9px); }
  .k .med { position:absolute; top:5px; right:6px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; border:3px solid var(--rc,#888); color:#1a2433; width:clamp(24px,17cqw,44px); height:clamp(24px,17cqw,44px); font-size:clamp(10px,9cqw,22px); }
  .k .pts { position:absolute; right:clamp(6px,5cqw,10px); bottom:clamp(4px,3cqh,10px); display:flex; align-items:center; gap:4px; background:#fffdf2de; border-radius:999px; padding:2px 7px; font-weight:800; color:#3a3312; font-size:clamp(11px,9cqw,18px); }
  .k .eff { display:none; position:absolute; left:6px; right:6px; bottom:6px; background:#31281adde8; color:#fde68a; border:1px solid #b08a2e; border-radius:8px; padding:4px 8px; font-size:clamp(9px,6.6cqw,12px); font-weight:700; line-height:1.3; text-align:left; }
  .phone.inhand .k .eff { display:block; }
  .k.ziel .ztxt { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:10px 12px 30px; text-align:center; }
  .k.ziel .ztxt b { font-size:clamp(11px,7.5cqw,14px); }
  .k.ziel .ztxt span { font-size:clamp(8px,6cqw,11px); color:#b9c4d6; line-height:1.35; }
  .k.ziel .big { font-size:clamp(24px,24cqw,44px); }
  .k.ziel .secret { position:absolute; top:5px; left:6px; font-size:clamp(7px,6cqw,9px); background:#31281a; color:#fde68a; border:1px solid #b08a2e; padding:2px 6px; border-radius:999px; }

  /* ---- Eigene Länder: je Reich eine Säule (Haufen) ---- */
  .landleiste { position:fixed; bottom:64px; left:50%; transform:translateX(-50%); width:100%; max-width:430px;
                display:flex; justify-content:space-evenly; align-items:flex-end; padding:6px 10px 8px;
                background:#0b1424f2; border-top:1px solid var(--line); z-index:28; min-height:46px; }
  .lcol { display:flex; flex-direction:column; align-items:center; gap:4px; padding-top:2px; }
  .lcol .dots { margin:0; display:flex; flex-direction:column-reverse; align-items:center; gap:5px; }
  .hrow { display:flex; gap:5px; justify-content:center; }

  /* ---- Aufklapper (Drawer) ---- */
  .drawer { position:fixed; bottom:124px; left:50%; transform:translateX(-50%); width:min(430px, calc(100% - 14px)); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px; display:none; box-shadow:0 -8px 30px #000c; max-height:46dvh; overflow-y:auto; z-index:48; transition:transform .25s ease; }
  /* v2.8: Zieh-Kasten darf höher werden, damit die Buttons DIRECT unter der
     großen Karte sitzen, ohne im Kasten scrollen zu müssen (Nutzer-Wunsch). */
  .drawer.frisch { max-height:76dvh; }
  /* v2.6: offener Drawer rutscht über das Aktionsband, damit Ausspielen erreichbar bleibt */
  .phone.lagerhoch .drawer { transform:translate(-50%, calc(-1 * var(--lagerlift, 118px))); }
  .drawer.open { display:block; }
  .drawer h4 { margin:0 0 10px; font-size:.86rem; color:#fbbf24; }
  .drawer h4 small { font-weight:400; }
  .drawer .sub { font-size:.7rem; color:#94a3b8; margin:8px 0 6px; }
  .drawer.frisch { border:2px solid #fbbf24; }
  .grid4 { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:4px; }
  /* v2.7: Gratis gezogene Karten im Drawer GROSS im Handkarten-Format (Nutzer-Wunsch)
     v2.8: leicht verkleinert + fächerig überlappend (aktuelle Karte ganz rechts/oben),
     damit alles auf einen Blick passt: Karte + Button direkt darunter, ohne Scroll. */
  .freshfan { display:flex; justify-content:center; align-items:flex-end; flex-wrap:nowrap; gap:0; margin-top:4px;
              --ch:min(34dvh,230px); --cw:calc(var(--ch)*.667); }
  .freshfan .k { margin-right:calc(var(--cw)*-.45); }
  .freshfan .k:last-child { margin-right:0; }
  .freshfan .k.sel { box-shadow:0 0 0 3px var(--gold), 0 12px 28px #000c; z-index:5; }
  .drawer .k .eff { display:block; }
  .mon { display:inline-block; background:rgba(239,68,68,.15); color:#fecaca; border-radius:8px; padding:3px 8px; margin:2px; font-size:.7rem; }
  .stf { display:inline-block; background:rgba(6,182,212,.15); color:#a5f3fc; border-radius:8px; padding:3px 8px; margin:2px; font-size:.7rem; cursor:pointer; text-decoration:underline dotted; }
  .stfdetail { background:rgba(6,182,212,.12); border:1px solid rgba(6,182,212,.3); border-radius:10px; padding:8px 10px; font-size:.68rem; margin-top:6px; line-height:1.4; }

  /* kompakte Karten in Aufklappern/Wechsel-Schirmen */
  .card { position:relative; background:#101b2e; color:#e2e8f0; border-radius:12px; border:2px solid #888; padding:8px 9px; text-align:left; font-size:.72rem; overflow:hidden; }
  .card:disabled { opacity:.55; }
  .card.selected { outline:4px solid #fbbf24; }
  .card .type { font-size:.6rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
  .card .name { font-size:.85rem; font-weight:800; line-height:1.15; margin-top:1px; }
  .card .info { font-size:.68rem; color:#94a3b8; margin-top:2px; line-height:1.35; }
  .card.blocked { opacity:.5; }
  .sperre { position:absolute; top:-8px; right:-6px; background:#fbbf24; color:#1e293b; font-size:.58rem; font-weight:800; border-radius:999px; padding:2px 8px; transform:rotate(6deg); }

  /* ---- Untere Leiste: runde Eck-Buttons + eigene Werte ---- */
  .bottombar { position:fixed; bottom:0; width:100%; max-width:430px; left:50%; transform:translateX(-50%); display:flex; gap:7px; align-items:stretch; background:#0b1424f2; border-top:1px solid var(--line); padding:8px; z-index:30; height:64px; }
  .corner { position:relative; width:46px; height:46px; border-radius:50%; background:var(--panel); border:1px solid var(--line); font-size:1.3rem; display:flex; align-items:center; justify-content:center; flex:0 0 46px; align-self:center; }
  .corner.open { border-color:var(--gold); }
  /* v2.7: 🃏-Ziehwahl-Knopf pulsiert golden – die laufende Ziehung nicht übersehen */
  .corner.hot { border-color:#fbbf24; animation:freshpulse 1.6s ease-in-out infinite; }
  @keyframes freshpulse { 0%,100% { box-shadow:0 0 0 0 #fbbf2400; } 50% { box-shadow:0 0 0 7px #fbbf233; } }
  .corner .badge { position:absolute; top:-4px; right:-4px; background:#dc2626; color:#fff; font-size:.62rem; font-weight:800; min-width:17px; height:17px; border-radius:999px; display:flex; align-items:center; justify-content:center; border:2px solid #0f172a; padding:0 2px; }
  .midst { flex:1; display:flex; align-items:center; justify-content:center; gap:4px; font-size:.85rem; color:#cbd5e1; min-width:0; flex-wrap:wrap; }
  .midst b { color:#fff; }
  .midst .sep { color:#31405f; }

  /* ---- Allgemeine Wechsel-Schirme (Lobby, Gefahrenprobe, Wertung) ---- */
  .cwrap { max-width:440px; margin:0 auto; padding:16px 12px 40px; }
  .card-panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:10px; }
  .label { font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:#94a3b8; margin-bottom:6px; }
  .center { text-align:center; }
  .muted { color:#94a3b8; font-size:.8rem; }
  .cwrap button { border:none; border-radius:12px; padding:11px 14px; font-weight:700; font-size:.9rem; }
  .cwrap input { background:#101b2e; color:#e2e8f0; border:1px solid var(--line); border-radius:12px; padding:11px 12px; font-size:.9rem; width:100%; }
  .bigcode { font-size:2.6rem; font-weight:800; letter-spacing:.3em; color:#fcd34d; text-align:center; margin:6px 0; }
  /* 🔎 v3.0 Schlusswertung: großer Kasten in der MITTE, ÜBER allem anderen (Overlay),
     so muss man auch mit 5 Spielern nicht erst an den Mitspielern vorbei scrollen. */
  .revwrap { position:fixed; inset:0; z-index:60; background:rgba(3,7,15,.88); display:flex; align-items:center; justify-content:center; padding:12px; }
  /* v3.1: Kasten voll DECKEND (Nutzer-Wunsch: durchscheinender Hintergrund
     störte beim Lesen) – dunkelgoldener Schein oben, solide dunkle Basis. */
  .rev { width:min(680px,100%); max-height:min(88dvh,830px); overflow-y:auto; background:linear-gradient(180deg, #4b3a20 0%, #2b3154 45%, #1b2340 100%); border:1px solid rgba(251,191,36,.35); border-radius:16px; padding:14px; margin:0; box-shadow:0 18px 50px rgba(0,0,0,.6); }
  .rev h2 { font-size:1.1rem; color:#fcd34d; text-align:center; margin-bottom:10px; }
  .revrow { display:flex; flex-wrap:wrap; gap:4px 10px; justify-content:space-between; align-items:center; background:rgba(255,255,255,.05); border-radius:10px; padding:8px 10px; margin:4px 0; font-size:.78rem; }
  .revrow.me { background:rgba(245,158,11,.2); border:1px solid rgba(245,158,11,.4); }
  .revrow .pts { font-weight:800; white-space:nowrap; margin-left:10px; }
  .goal { font-size:.68rem; color:#94a3b8; }
  .logbox { max-height:180px; overflow-y:auto; font-size:.72rem; color:#cbd5e1; }
  .logbox div { padding:3px 0; border-bottom:1px dashed rgba(255,255,255,.06); }
  .chatrow { display:flex; gap:8px; margin-top:8px; }
  .chatrow input { flex:1; }
  .chatrow button { padding:8px 14px; }

  /* ---- v2.3: Lobby & Start im dunkel-goldenen Anzug des Spieltischs ---- */
  .start { min-height:100dvh; color:#e2e8f0;
            background:radial-gradient(1100px 520px at 50% -8%, rgba(233,199,102,.10), transparent 62%),

<body>
<div id="status">⚠️ Verbindung getrennt – versuche neu zu verbinden…</div>
<div id="toast"></div>
<div id="app"></div>
<div id="actionbar" style="display:none"><div class="inner" id="actionbar-inner"></div></div>
<script>
"use strict";
const REALMS = [
  { id: "wald", name: "Verwusch. Wald", short: "Wald", emoji: "🌲" },
  { id: "tiefsee", name: "Tiefsee", short: "Tiefsee", emoji: "🌊" },
  { id: "wolken", name: "Wolkenlande", short: "Wolken", emoji: "☁️" },
  { id: "hoehlen", name: "Höhlenlande", short: "Höhlen", emoji: "🕳️" },
  { id: "dunkel", name: "Dunkellande", short: "Dunkel", emoji: "🌑" },
];
const TRAUM = { id: "traum", name: "Traumlande", short: "Traum", emoji: "🌙" };
const ALL_REALMS = [...REALMS, TRAUM];
const realmInfo = (id) => ALL_REALMS.find((r) => r.id === id) || TRAUM;

const app = document.getElementById("app");
const actionBar = document.getElementById("actionbar");
const actionInner = document.getElementById("actionbar-inner");

// v2.1: Band-Sichtbarkeit zentral steuern - haelt zusaetzlich die phone-Klasse "bandhoch"
// synchron, damit die gewaehlte Karte UEBER dem Band sitzt statt dahinter.
// v2.6: Ein offener Drawer (z. B. Lager) rutscht mit hoch, wenn das Band kommt –
// so bleibt er beim Ausspielen eingelagerter Karten sichtbar (Nutzer-Wunsch),
// statt dass der Kasten verschwindet. Der Lift wird aufs Band-Maass skaliert.
function actionBand(show) {
  actionBar.style.display = show ? "block" : "none";
  const ph = document.getElementById("phone");
  if (ph) ph.classList.toggle("bandhoch", !!(show && typeof inhand !== "undefined" && inhand));
  if (ph) {
    ph.classList.toggle("lagerhoch", !!(show && openDrawer));
    if (show) ph.style.setProperty("--lagerlift", ((actionBar.offsetHeight || 104) + 10) + "px");
  }
}
const statusEl = document.getElementById("status");
const toastEl = document.getElementById("toast");

let ws = null;
let state = null;
let selected = null;       // aktuell gewählte Karte (aus Hand oder Aufbewahrung)
let selectedFrom = null;    // "hand" | "stored"
let staffDetail = null;    // {pi, name}
let myName = "";
let manualClose = false;
let lastMsg = 0;              // 📡 v3.2: letzter Empfangszeitpunkt (Watchdog gegen stille Verbindungen)
let menagerieOpen = false;  // eigene Menagerie aufgeklappt? (nur für dich sichtbar)
let goalsOpen = false;      // eigene Ziele aufgeklappt?
let simSel = null;          // ⚡ Schnell: verdeckte Wahl {cardId, action, realm}
let simDiscard = null;      // ⚡ Schnell (2er): Karte für die offene Ablage
window._simEditing = false; // ⚡ „Ändern“-Modus nach dem Bestätigen
window._simSent = false;    // v2.9: „✅ Fertig“ wurde getippt (Wahl ist raus)

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (toastEl.style.display = "none"), 3500);
}

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function connect() {
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(proto + location.host);
  ws.onopen = () => {
    lastMsg = Date.now();
    statusEl.style.display = "none";
    const token = localStorage.getItem("com-token");
    if (token) send({ t: "resume", token });
    else renderConnect();
  };
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    lastMsg = Date.now();
    if (msg.t === "state") {
      state = msg;
      // 🚨 Fanfare: neues FETTES Monster → großes TAMTAM (jede Fanfare nur 1× zeigen)
      if (state.gameId !== (window._fanGame || 0)) { window._fanGame = state.gameId; window._fanSeen = (state.fanfare && state.fanfare.id) || null; }
      else if (state.fanfare && state.fanfare.id !== window._fanSeen) { window._fanSeen = state.fanfare.id; showFanfare(state.fanfare); }
      // Auswahl zurücksetzen, wenn die gewählte Karte nicht mehr bei mir liegt
      if (selected && !(state.hand || []).concat(state.stored || []).some((c) => c.id === selected.id)) selected = null;
      // ⚡ verdeckte Wahl pflegen: nach der Ausführung ist sie weg, nach Reconnect wiederherstellen
      if (simSel && !((state.hand || []).some((c) => c.id === simSel.cardId))) { simSel = null; simDiscard = null; window._simSent = false; }
      if (!state.mySimPick) {
        if (!simSel) { window._simEditing = false; window._simSent = false; }
      } else if (!window._simEditing && !simSel && (state.hand || []).some((c) => c.id === state.mySimPick.cardId)) {
        simSel = { cardId: state.mySimPick.cardId, action: state.mySimPick.action, realm: state.mySimPick.realm };
        simDiscard = state.mySimPick.discardId || null;
        window._simSent = true; // v2.9: Server-Bestätigung bedeutet: „Fertig“ wurde getippt
      }
      render();
    }
    else if (msg.t === "token") localStorage.setItem("com-token", msg.token);
    else if (msg.t === "closed") {
      // 🚪 Raum wurde geschlossen (Host) – zurück zum Startbildschirm
      localStorage.removeItem("com-token");
      state = null; simSel = null; simDiscard = null; selected = null; selectedFrom = null; window._simEditing = false; window._simSent = false;
      renderConnect();
      toast(msg.msg || "Der Raum wurde geschlossen.");
    }
    else if (msg.t === "error") { toast(msg.msg); if (!state) renderConnect(); }
  };
  ws.onclose = () => {
    statusEl.style.display = "block";
    if (!manualClose) setTimeout(connect, 2000);
  };
}

// 📡 v3.2 VERBINDUNGS-PULS: Manche Handys frieren die WebSocket im Hintergrund
// still ein – die Seite zeigte dann einen veralteten Stand und „aktualisiert
// nicht automatisch“, erst ein Neuladen half. Jetzt pulst der Client alle paar
// Sekunden und bekommt als Antwort immer den frischen Spielstand. Bleibt die
// Antwort länger aus, wird die Verbindung kraftgeschlossen und automatisch neu
// aufgebaut (resume holt den Stand). Beim Zurückkehren in die App (Tab wieder
// sichtbar / Handy entsperrt) wird sofort gepulst oder neu verbunden.
setInterval(() => {
  if (!ws || ws.readyState !== 1) return;
  if (lastMsg && Date.now() - lastMsg > 25000) { try { ws.close(); } catch (e) {} return; }
  send({ t: "ping" });
}, 8000);
const onVisibleAgain = () => {
  if (!ws || ws.readyState !== 1) { connect(); return; }
  if (lastMsg && Date.now() - lastMsg > 30000) { try { ws.close(); } catch (e) {} return; }
  send({ t: "ping" });
};
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") onVisibleAgain(); });
window.addEventListener("pageshow", (ev) => { if (ev.persisted) onVisibleAgain(); });

// ---------------------------- Bausteine -------------------------------------

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function cardBorder(c) {
  return c.type === "Land" ? "#65a30d" : c.type === "Monster" ? "#dc2626" : c.type === "Ziel" ? "#7c3aed" : c.type === "Event" ? "#ea580c" : "#0891b2";
}
function cardTypeLabel(c) {
  const ri = realmInfo(c.realm);
  if (c.type === "Monster") return `${ri.emoji} Monster · Level ${c.cost}`;
  if (c.type === "Land") return `${ri.emoji} Land · ${c.level} Pkt.${c.level >= 2 && c.realm !== "traum" ? " · entfernt" : ""}`;
  return c.type === "Mitarbeiter" ? "👷 Mitarbeiter" : c.type === "Event" ? "🎪 Event" : "🔒 Ziel";
}
// ============================================================
// v2.7: Original-Kartentexte (aus den Kartenscans) liegen zusätzlich
// IM CLIENT. server.js schickt zwar dieselben Texte mit – aber wenn auf
// dem Host noch ein ÄLTERER server.js läuft (ohne Texte), zeigen Events,
// Ziele und Mitarbeitende jetzt trotzdem Originaltext statt Lücke/Kurzform.
// ============================================================
const TOUR_ORIGINALS = {

  tiefsee: "Erhalte 1 Krone für jeden Tiefsee-Landpunkt, den du im Spiel hast.",

};
const EVENT_ORIGINALS = {
  hunter: "+1 Jägermarker",
  coins2: "+2 Kronen",
  summer: "Erhalte 2 Kronen für jede Mitarbeitenden-Karte, die du im Spiel hast.",

};
const STAFF_ORIGINALS = {
  "Robin Goodall": "+2 Kronen jedes Mal, wenn du ein Monster des Verwunschenen Waldes ausspielst.",

  "Amelia Fogg": "+2 Kronen jedes Mal, wenn du ein Monster der Wolkenlande ausspielst.",

  "P. T. Martini": "Immer wenn du ein Event ausspielst, erhältst du eine Krone.",
};
const GOAL_ORIGINALS = {
  sparsam: "6 SP, falls du keinen Kredit aufgenommen hast.",
  entdecker: "2 SP für jedes entfernte Land, das du im Spiel hast (Länder mit 2/3 Landpunkten, Traumlande ausgenommen).",
  gefahrSP: "1 SP für jedes Gefahrensymbol auf Monstern in deiner Menagerie.",

  klein: "1 SP für jedes Level-1-Monster in deiner Menagerie.",
  ausruestung: "2 SP für jeden Jägermarker, den du am Ende des Spiels noch hast.",
  zweite: "7 SP, falls du nach allen anderen Punkten auf dem 2. Platz oder punktgleich mit dem Ersten bist.",
};
// Wertung/Aufdecken: Ziele kommen vom Server mit Name statt Key – Namens-Fallback mitfassen.
const GOAL_ORIGINAL_NAMES = {};
[
  ["sparsam", "Sparsamkeit ist eine Tugend"], ["entdecker", "Entdecker der letzten Grenzen"], ["gefahrSP", "Gefahrensucher"],
  ["traumExp", "Autorität für übernatürliche Kreaturen"], ["verwalter", "Verwalter"], ["grosswild", "Großwildjäger"],
  ["spezialist", "Spezialist"], ["waldExp", "Autorität für waldbewohnende Kreaturen"], ["besessen", "Eine offensichtliche Besessenheit"],
  ["ehrenmann", "Ein wahrer Ehrenmann zahlt seine Schulden"], ["hoehlenExp", "Autorität für unterirdische Kreaturen"],
  ["wolkenExp", "Autorität für fliegende Kreaturen"], ["tiefseeExp", "Autorität für schwimmende Kreaturen"],
  ["dunkelExp", "Autorität für düstere Kreaturen"], ["silber", "Mit dem Silberlöffel im Mund geboren"],
  ["arbeitgeber", "Arbeitgeber des Jahres"], ["traumland", "Suchender jenseits des Tores der Träume"],
  ["tausendsassa", "Tausendsassa"], ["klein", "Freund kleiner Dinge"], ["ausruestung", "Solide Ausrüstung"],
  ["zweite", "Die zweite Reihe ist gut genug für mich"],
].forEach(([k, n]) => { GOAL_ORIGINAL_NAMES[n] = GOAL_ORIGINALS[k]; });
function originalGoalText(g) {
  return GOAL_ORIGINALS[g.key] || GOAL_ORIGINAL_NAMES[g.name] || g.text || "";
}
function originalCardText(c) {
  if (c.type === "Ziel") return originalGoalText(c);
  if (c.type === "Mitarbeiter") return STAFF_ORIGINALS[c.name] || c.text
    || (c.kind === "land" ? "Unbekanntes Land: Bestimme den Typ des Landes, sobald du es ausspielst." : "dauerhafter Effekt");
  if (c.type === "Event") {
    if (c.kind === "tour" && TOUR_ORIGINALS[c.realm]) return TOUR_ORIGINALS[c.realm];
    return EVENT_ORIGINALS[c.kind] || c.text || "";
  }
  return c.text || "";
}
function cardInfo(c) {
  const ri = realmInfo(c.realm);
  let t = "";
  if (c.type === "Monster") {
    t = `Belegt ${c.cost} ${c.realm === "traum" ? "🌙 (oder 🌙+1 Reich)" : ri.emoji} · ⭐${c.points}`;
    if (c.draw > 0) t += ` · 🃏 zieht ${c.draw}`;
    if (c.danger > 0) t += ` · ⚠️ ${c.danger}`;
  } else if (c.type === "Mitarbeiter" || c.type === "Event" || c.type === "Ziel") {
    t = (c.type === "Mitarbeiter" ? `−${c.cost} 👑 · ` : "") + originalCardText(c); // v2.7: Originaltext auch im Drawer/Info
  }
  return t;
}
function cardHTML(c, opts) {
  opts = opts || {};
  const border = cardBorder(c);
  const blocked = opts.blocked ? " blocked" : "";
  const sel = opts.selected ? " selected" : "";
  const badge = opts.blocked && c.type === "Monster" ? `<span class="sperre">gesperrt</span>` : "";
  const onclick = opts.onClick ? `onclick="${opts.onClick}"` : "disabled";
  return `<button class="card${sel}${blocked}" style="border-color:${border}" ${onclick}>
    <div class="type" style="color:${border}">${cardTypeLabel(c)}</div>
    <div class="name">${esc(c.name || realmInfo(c.realm).name)}</div>
    <div class="info">${esc(cardInfo(c))}</div>
    ${badge}</button>`;
}
function freeLandsOf(lands, seasonMonsters) {
  const occ = {};
  (seasonMonsters || []).forEach((m) => {
    if (m.realm === "traum") {
      occ.traum = (occ.traum || 0) + (m.paidTraum || 0);
      if (m.helperRealm) occ[m.helperRealm] = (occ[m.helperRealm] || 0) + (m.helperCount || 0);
    } else occ[m.realm] = (occ[m.realm] || 0) + m.cost;
  });
  const f = {};
  ALL_REALMS.forEach((r) => { f[r.id] = (lands[r.id] || 0) - (occ[r.id] || 0); });
  return f;
}
function canPlayMonster(m, me) {
  const free = freeLandsOf(me.lands, me.seasonMonsters);
  if (m.realm === "traum") {
    if (free.traum >= m.cost) return true;
    return REALMS.some((r) => free[r.id] + free.traum >= m.cost);
  }
  return (free[m.realm] || 0) >= m.cost;
}
function canPlayLand(c, me) {
  if (c.realm === "traum") return true;
  if (c.level === 1) return true;
  if (c.level === 2) return (me.lands[c.realm] || 0) >= 1;
  return (me.lands[c.realm] || 0) >= 2;
}
function cardPlayable(c, me) {
  if (c.type === "Monster") return canPlayMonster(c, me);
  if (c.type === "Land") return canPlayLand(c, me);
  return true;
}


window.toggleStaff = (pi, name) => {
  staffDetail = staffDetail && staffDetail.pi === pi && staffDetail.name === name ? null : { pi, name };

};
window.toggleMenagerie = () => {

};

};

window.freshPlay = (id) => send({ t: "freshDecide", cardId: id, action: "play", realm: window._freshRealm || null });
window.freshKeep = (id) => send({ t: "freshDecide", cardId: id, action: "keep" });
window.freshClear = () => send({ t: "freshClear" });
window.chooseFreshRealm = (rid) => { window._freshRealm = rid; render(); };


function turnBanner(s) {
  if (s.phase === "draft") {
    if (s.mode === "turbo") {
      if (s.turboDiscard) return `<div class="banner your">🗑️ Lege jetzt 1 Karte OFFEN aus dem Spiel ab!</div>`;
      // 📌 Stau-Ruf: Hält genau EIN Spieler noch Karten, warten alle anderen bei ihm
      if (s.hand.length > 0) {
        if (s.turboStuck === s.you)
          return `<div class="banner your">🔥 Alle stauen sich bei DIR – wähle deine Karte!${(s.incomingCount || 0) > 0 ? ` · 📌 noch ${s.incomingCount} Stapel in deiner Warteschlange` : ``}</div>`;
        return `<div class="banner your">🚀 Du bist dran – wähle eine Karte!${(s.incomingCount || 0) > 0 ? ` · 📌 noch ${s.incomingCount} Stapel in deiner Warteschlange` : ``}</div>`;
      }
      if ((s.turboStuck || 0) >= 0 && s.turboStuck !== s.you)
        return `<div class="banner wait">📌 Es staut sich bei ${esc(s.players[s.turboStuck].name)}…</div>`;
      const n = s.players.length;
      const dirLeft = s.season % 2 === 0;
      const pred = s.players[dirLeft ? (s.you - 1 + n) % n : (s.you + 1) % n];
      return `<div class="banner wait">⏳ ${esc(pred.name)} spielt gerade – deine neuen Karten kommen gleich…</div>`;
    }
    // ⚡ Schnell & 🐢 Langsam: alle wählen gleichzeitig verdeckt
    if (s.mode === "schnell" || s.mode === "langsam") {
      // Sobald nur noch EINER wählt: „Alle warten auf …“ (Nutzer-Wunsch)
      const waiting = s.simWaiting || [];
      const waitMsg = waiting.length === 1
        ? `<div class="center" style="margin-top:6px;font-weight:800;color:#fcd34d">⏳ Alle warten auf ${waiting[0] === s.you ? "DICH" : esc(s.players[waiting[0]].name)}…</div>`
        : "";
      const chips = `${waitMsg}<div class="chips" style="margin-top:6px;justify-content:center">${s.players.map((p, i) => `<span class="chip">${s.simReady && s.simReady[i] ? "✅" : "⏳"} ${esc(p.name)}</span>`).join("")}</div>`;
      // 🐢 Aufdeck-Phase: reihum deckt jeder seine Karte selbst auf
      if (s.showTurn >= 0) {
        if (s.awaitDiscard === s.you) return `<div class="banner your">🗑️ Lege jetzt 1 Karte OFFEN aus dem Spiel ab!</div>`;
        if (s.showTurn === s.you) {
          if ((s.freshDraw || []).some((c) => c.type !== "Ziel"))
            // v2.7: Banner ist jetzt ein KNOPF – der Zieh-Kasten lässt sich hiermit
            // jederzeit wieder öffnen (Nachbauten des „Kasten ist weg“-Dead-Ends).
            return `<div class="banner your" style="cursor:pointer" onclick="event.stopPropagation();toggleDrawerById('dFresh')">🃏 Deine gezogenen Karten warten – hier antippen, falls der Kasten zu ist!</div>`;
          return `<div class="banner your">🔍 Du bist dran – decke deine Karte auf!</div>
            <div class="center" style="margin-top:6px"><button class="btn-green" onclick="revealNow()">👁️ Jetzt aufdecken!</button></div>`;
        }
        return `<div class="banner wait">⏳ ${esc(s.players[s.showTurn].name)} deckt gerade auf…</div>`;
      }
      if (s.mySimPick && !window._simEditing)
        return `<div class="banner your">✅ Deine Wahl steht fest – du kannst unten noch ✏️ ändern, solange nicht alle fertig sind…</div>${chips}`;
      if (s.mySimPick && window._simEditing)
        return `<div class="banner your">✏️ Wähle einfach neu – nach deinem neuen „Fertig“-Tipp ersetzt sie die alte Wahl. Bis dahin bleibt die alte stehen.</div>${chips}`;
      if (simSel) {
        if (s.players.length === 2 && s.mode === "schnell" && s.hand.length > 1 && !simDiscard)
          return `<div class="banner your">🗑️ Karte gewählt – tippe jetzt deine ABWURFKARTE an: Sie wird OFFEN abgelegt und alle sehen sie. Danach schließt „Fertig“ deinen Zug ab.</div>${chips}`;
        return `<div class="banner your">✅ Deine Wahl liegt bereit – tippe unten auf „Fertig“, dann ist dein Zug abgegeben. Mit „✏️ Ändern“ wählst du stattdessen neu.</div>${chips}`;
      }
      // v2.5: Der Hinweis „Alle wählen gleichzeitig…“ ist weg (Nutzer-Wunsch) –
      // die Chips zeigen, wer schon fertig ist, der Rest steht im Band.
      return chips;
    }
    if (s.awaitDiscard >= 0) {
      if (s.awaitDiscard === s.you) return `<div class="banner your">🗑️ Lege jetzt 1 Karte OFFEN aus dem Spiel ab!</div>`;
      const dc = s.players[s.awaitDiscard];
      return `<div class="banner wait">⏳ ${esc(dc.name)} legt eine Karte offen ab…</div>`;
    }
    if (s.isYourTurn) return `<div class="banner your">🎯 Du bist am Zug – wähle eine Karte!</div>`;
    const cur = s.players[s.turn];
    return `<div class="banner wait">⏳ ${esc(cur.name)} ist am Zug…${cur.connected ? "" : " (Verbindung verloren – warte auf Rückkehr)"}</div>`;
  }
  if (s.phase === "seasonEnd") {
    if (s.isYourSeasonTurn) return `<div class="banner your">📐 Du darfst noch Eingelagertes ausspielen</div>`;
    return `<div class="banner wait">⏳ Die anderen spielen noch…</div>`;
  }
  return "";
}

  if (old) old.remove();

  el.id = "fanfare";
  el.innerHTML = `<div class="fanbox">

function fanfareDing() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = fanfareDing._ctx || (fanfareDing._ctx = new AC());
    [0, 0.18, 0.36].forEach((t) => {
      const o = ctx.createOscillator(); const gn = ctx.createGain();
      o.type = "sine"; o.frequency.value = 830;
      const t0 = ctx.currentTime + t;
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
      o.connect(gn); gn.connect(ctx.destination);
      o.start(t0); o.stop(t0 + 0.45);
    });
  } catch (e) {}
}

// immer am unteren Rand, wie sonst „✅ Ausspielen“.

// Eingelagertes aus und jeder tippt für sich „Fertig“. Erst wenn alle fertig

function seasonEndButtons(s) {

function renderActionBar() {
  const seTurnActive = state.phase === "seasonEnd" && state.isYourSeasonTurn;
  // ⚡/🐢 schon bestätigt und nicht im Ändern-Modus: unten großer „Ändern“-Knopf –
  // die Wahl bleibt änderbar, solange nicht alle Spieler fertig sind
  if ((state.mode === "schnell" || state.mode === "langsam") && state.phase === "draft" && state.showTurn < 0 && state.mySimPick && !window._simEditing) {
    // v2.2: IMMER sichtbar nach dem Bestätigen (wie v1.9.7). Der v2.1-Versteck-Trick
    // war eine Falle: Nach dem Bestätigen sind die Karten deaktiviert, der Fächer
    // lässt sich gar nicht mehr anheben – es gab KEINEN Weg zurück zum Ändern/Fertig.
    actionInner.innerHTML = `<button class="btn-indigo" onclick="simEdit()">✏️ Ändern</button>
      <div class="note">Deine Wahl ist abgegeben – du kannst sie noch ändern, solange nicht alle fertig sind.</div>`;
    actionBand(true);
    return;
  }
  // v2.2: Hat man schon aufs Ausspielen/Einlagern getippt (Wahl gestuft, simSel), bleibt
  // die Wahl greifbar: Karten wieder angehoben -> „Fertig/Ändern“ kommt zurück, ohne
  // dass man die Karte neu antippen muss (Tipp auf die goldene Karte öffnet sonst den Ändern-Modus).
  const stagingMode = (state.mode === "schnell" || state.mode === "langsam") && state.phase === "draft";
  const staged = stagingMode && simSel && ((selected && selected.id === simSel.cardId) || (!selected && inhand));
  if ((!selected || !(state.phase === "draft" || state.phase === "seasonEnd")) && !staged && !seTurnActive) { actionBand(false); return; }
  // offene Ablage: 2er-Wartezustand (Langsam) oder persönlicher Turbo-Schritt
  if (state.phase === "draft" && (state.awaitDiscard === state.you || (state.mode === "turbo" && state.turboDiscard))) {
    if (state.mode === "turbo" && selectedFrom !== "hand") { actionBand(false); return; }
    actionInner.innerHTML = `<button style="background:#ea580c;color:#fff;flex:1" onclick="discardOpen()">🗑️ „${esc(selected.name || realmInfo(selected.realm).name)}" offen aus dem Spiel ablegen</button>
      <div class="note">Alle sehen, was raus ist. Danach wird 1 Karte verdeckt vom Nachziehstapel auf den weiterzugebenden Stapel gelegt.</div>`;
    actionBand(true);
    return;
  }
  const me = state.players[state.you];
  // 📐 Saisonende, keine Karte gewählt: nur der „Fertig“-Knopf unten
  if (seTurnActive && !selected) {
    actionInner.innerHTML = seasonEndButtons(state);
    actionBand(true);
    return;
  }
  let canUse;
  if (state.phase === "seasonEnd") canUse = state.isYourSeasonTurn;
  else if (state.mode === "langsam") canUse = state.isYourTurn || state.phase === "draft"; // 🐢 verdeckte Wahl ist gleichzeitig (v1.7) – jeder darf die Leiste nutzen
  else canUse = true; // ⚡/🚀: Eingelagertes jederzeit, Hand sobald du Karten hast
  if (!canUse) { actionBand(false); return; }
  // ⚡/🐢 Schnell & Langsam: Hand-Karten werden nur verdeckt GEWÄHLT –
  // ⚡ führt der „Fertig“-Klick alles aus, 🐢 der eigene „Jetzt aufdecken!“-Button
  const staging = stagingMode && selectedFrom === "hand"; // ⚡/🐢: Wahl bleibt verdeckt
  const onPlay = staging ? "stagePlay()" : "pickPlay()";
  const onKeep = staging ? "stageKeep()" : "pickKeep()";
  const traumFn = staging ? "stageTraum" : "pickTraum";
  let inner = "";
  if (staging && !staged) inner = state.mode === "langsam"
    ? `<div class="note" style="margin-bottom:6px">🐢 Deine Wahl bleibt verdeckt – wenn alle fertig sind, deckt ihr NACHEINANDER auf. Du klickst selbst „Jetzt aufdecken!“.</div>`
    : `<div class="note" style="margin-bottom:6px">⚡ Deine Wahl bleibt verdeckt – alles wird gleichzeitig ausgeführt, sobald alle fertig sind.</div>`;
  const inHand = selectedFrom === "hand";
  const isEntdecker = !!selected && selected.type === "Mitarbeiter" && selected.kind === "land";
  if (staged) {
    // v2.9 (Nutzer-Wunsch): Nach dem Tipp auf Ausspielen/Einlagern stehen
    // „✅ Fertig“ und „✏️ Ändern“ AN DERSELBEN Stelle. Erst der Tipp auf
    // „Fertig“ schickt die Wahl ab und beendet den Zug – nichts geht mehr
    // automatisch von selbst raus. Bei ⚡ 2er wird „Fertig“ erst klickbar,
    // sobald die Abwurfkarte gewählt ist.
    const twoP = state.mode === "schnell" && state.players.length === 2 && state.hand.length > 1;
    if (window._simSent) {
      // „Fertig“ wurde getippt: Wahl ist raus, nur noch Ändern (oder warten).
      inner = `<div class="note" style="margin-bottom:6px">✅ Abgeschickt – sobald alle fertig sind, wird ausgeführt. Mit „✏️ Ändern“ kannst du noch neu wählen.</div>
        <button class="btn-indigo" onclick="simEdit()">✏️ Ändern</button>`;
    } else if (twoP && !simDiscard) {
      inner = `<div class="note" style="margin-bottom:6px">🗑️ Und jetzt deine <b>ABWURFKARTE</b> im Kartenfächer antippen – danach wird „Fertig“ klickbar.</div>
        <button class="btn-green" disabled onclick="simConfirm()">✅ Fertig</button>
        <button class="btn-indigo" onclick="simEdit()">✏️ Ändern</button>`;
    } else {
      inner = `<div class="note" style="margin-bottom:6px">✅ Bereit – mit „Fertig“ gibst du deinen Zug ab. Mit „✏️ Ändern“ wählst du stattdessen neu.</div>
        <button class="btn-green" onclick="simConfirm()">✅ Fertig</button>
        <button class="btn-indigo" onclick="simEdit()">✏️ Ändern</button>`;
    }
  } else if (isEntdecker) {
    inner = `<div class="note" style="margin-bottom:6px">„${esc(selected.name)}" – Typ des Landes festlegen: <b>dauerhaft!</b> (−${selected.cost} 👑)</div>`;
    inner += ALL_REALMS.map((r) => `<button class="btn-indigo" onclick="chooseRealm('${r.id}')" ${staged ? "disabled" : ""}>${r.emoji} ${r.short}${window._realm === r.id ? " ✓" : ""}</button>`).join("");
    inner += `<button class="btn-green" onclick="${onPlay}" ${window._realm && !staged ? "" : "disabled"}>✅ Ausspielen</button>`;
  } else if (selected.type === "Monster" && selected.realm === "traum") {
    // 🌙 Traum-Monster: Bezahlung selber aussuchen (Nutzer-Wunsch)
    const free = freeLandsOf(me.lands, me.seasonMonsters);
    let opts = "";
    if (free.traum >= selected.cost)
      opts += `<button class="btn-green" style="flex:1;min-width:150px" onclick="${traumFn}(null)" ${staged ? "disabled" : ""}>✅ Nur 🌙 (${selected.cost} 🌙)</button>`;
    REALMS.forEach((r) => {
      const helper = free[r.id] || 0;
      if (helper > 0 && free.traum < selected.cost && free.traum + helper >= selected.cost)
        opts += `<button class="btn-indigo" style="flex:1;min-width:150px" onclick="${traumFn}('${r.id}')" ${staged ? "disabled" : ""}>✅ ${free.traum} 🌙 + ${selected.cost - free.traum} ${r.emoji}</button>`;
    });
    inner = `<div class="note" style="margin-bottom:6px">🌙 Traum-Monster – bezahlt mit Traumland und/oder GENAU EINEM Hilfsreich:</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${opts || '<span class="muted">Passt gerade nicht – zu wenig freie Landpunkte.</span>'}</div>`;
    if (state.phase === "draft" && inHand)
      inner += `<button class="btn-indigo" style="width:100%;margin-top:8px" onclick="${onKeep}" ${staged ? "disabled" : ""}>📥 Einlagern (−1 👑)</button>`;
  } else if (selected.type === "Ziel") {
    inner = `<button class="btn-purple" onclick="${onKeep}" ${state.phase === "draft" && inHand && !staged ? "" : "disabled"}>📥 Als Ziel annehmen (−1 👑)</button>`;
  } else {
    const playable = cardPlayable(selected, me);
    inner = `<button class="btn-green" onclick="${onPlay}" ${playable && !staged ? "" : "disabled"}>✅ Ausspielen${selected.type === "Mitarbeiter" ? ` (−${selected.cost} 👑)` : ""}</button>`;
    // v2.6: Bei eingelagerten Karten ergibt „Einlagern“ keinen Sinn – nur für Handkarten.
    // v3.2 (Nutzer-Wunsch): Events und Mitarbeitende werden NICHT eingelagert – sie müssen ausgespielt werden.
    if (inHand && selected.type !== "Event" && selected.type !== "Mitarbeiter") inner += `<button class="btn-indigo" onclick="${onKeep}" ${state.phase === "draft" && !staged ? "" : "disabled"}>📥 Einlagern (−1 👑)</button>`;
  }
  const stCard = (!selected && staged && simSel) ? ((state.hand || []).find((c) => c.id === simSel.cardId) || null) : null;
  const nc = selected || stCard;
  let note = nc ? `„${esc(nc.name || realmInfo(nc.realm).name)}“` : "";
  const me2 = state.players[state.you];
  if (nc) {
    if (nc.type === "Monster" && !canPlayMonster(nc, me2))
      note += nc.realm === "traum" ? " – braucht 🌙 bzw. 🌙+EIN Reich!" : " – zu wenig Kapazität!";
    if (nc.type === "Land" && !canPlayLand(nc, me2)) note += " – entfernte Länder brauchen Vorbedingung";
    if (nc.type === "Mitarbeiter" && me2.coins < nc.cost) note += " · 🏦 Kredit nötig (+3 👑, −5 SP)";
    if (nc.type === "Ziel") note += " · Ziele nur annehmen, nicht ausspielen";
  }
  if (seTurnActive) inner += seasonEndButtons(state);
  actionInner.innerHTML = inner + `<div class="note">${note}</div>`;
  actionBand(true);
}

          <button class="${(s.seasons || 4) === 4 ? "btn-amber" : "btn-ghost"}" style="flex:1;font-size:0.9rem" onclick="setSeasons(4)">4 Saisons</button>
          <button class="${s.seasons === 5 ? "btn-amber" : "btn-ghost"}" style="flex:1;font-size:0.9rem" onclick="setSeasons(5)">5 Saisons</button>
        </div>
      </div>` : `<p class="muted center" style="max-width:420px">${s.seasons || 4} Saisons – vom Host gewählt.</p>`}
      ${s.isHost ? `<div class="card-panel" style="max-width:420px;width:100%">
        <div class="label">Spieltempo (gilt für alle)</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <button class="${(s.mode || "langsam") === "langsam" ? "btn-amber" : "btn-ghost"}" style="font-size:0.9rem" onclick="setMode('langsam')">🐢 Langsam – alle wählen verdeckt, decken nacheinander auf</button>
          <button class="${s.mode === "schnell" ? "btn-amber" : "btn-ghost"}" style="font-size:0.9rem" onclick="setMode('schnell')">⚡ Schnell – alle wählen gleichzeitig</button>
          <button class="${s.mode === "turbo" ? "btn-amber" : "btn-ghost"}" style="font-size:0.9rem" onclick="setMode('turbo')">🚀 Turbo – jeder im eigenen Tempo</button>
        </div>
        <p class="muted" style="margin-top:8px">🚀 lohnt sich vor allem ab 3 Spielern.</p>
      </div>` : `<p class="muted center" style="max-width:420px">Spieltempo: ${(s.mode || "langsam") === "langsam" ? "🐢 Langsam (alle wählen verdeckt, decken nacheinander auf)" : s.mode === "schnell" ? "⚡ Schnell (alle wählen gleichzeitig)" : "🚀 Turbo"} – vom Host gewählt.</p>`}
      ${s.isHost
        ? `<button class="btn-amber" style="max-width:420px;width:100%" ${s.names.filter((p) => p.connected).length >= 2 ? "" : "disabled"} onclick="startGame()">🚀 Partie starten (ab 2 Spielern)</button>`
        : `<div class="banner wait" style="width:100%;max-width:420px">Warte, bis der Host startet…</div>`}
      <button class="btn-ghost" style="max-width:420px;width:100%;font-size:0.85rem" onclick="leaveRoom()">${s.isHost ? "🚪 Raum schließen – alle landen wieder am Start" : "🚪 Raum verlassen"}</button>
      <p class="muted center" style="max-width:340px">Ihr seid 2–5 Spieler. Jeder sieht nur seine eigenen Karten – der Server wacht darüber.</p>
    </div>`;
}
window.startGame = () => send({ t: "start" });
// 🤖 Bots (nur Host, nur Lobby)
window.addBot = () => send({ t: "addBot" });
window.removeBot = (name) => { if (confirm(`${name} entfernen?`)) send({ t: "removeBot", name }); };
// 🚪 Raum verlassen (Gast) bzw. für alle schließen (Host) – zurück zum Startbildschirm.
// Das Token wird gelöscht: Beim nächsten Öffnen landet man NICHT mehr im alten Raum.
window.leaveRoom = () => {
  if (!state) return;
  const host = state.you === 0;
  const midGame = state.phase !== "lobby";
  const q = host
    ? `Raum für ALLE schließen?\nAlle Spieler (${state.names.length}) landen wieder am Start.` + (midGame ? `\nDie laufende Partie wird beendet.` : ``)
    : midGame
      ? `Partie verlassen?\nDu kannst danach NICHT zu dieser Partie zurückkehren.`
      : `Raum verlassen?`;
  if (!confirm(q)) return;
  send({ t: "leave" });
  localStorage.removeItem("com-token");
  state = null; simSel = null; simDiscard = null; selected = null; selectedFrom = null; window._simEditing = false; window._simSent = false;
  renderConnect();
};

// 🎲 v3.1: Auch die Gefahrenprobe läuft als GROSSER Kasten in der Bildschirm-Mitte
// (Overlay, deckend) – und nur der HOST würfelt bzw. klickt weiter: Alle sehen
// dasselbe im selben Moment, wie bei der großen Schlusswertung.
function renderDanger(s) {
  const d = s.dice;
  const title = `<div class="label center" style="font-size:1rem;color:#fcd34d">🎲 Gefahrenprobe – Saison ${s.season + 1}</div>`;
  let body = "";
  let btn = "";
  if (!d) {
    // Noch nicht gewürfelt: offene Gefahrensymbole je Spieler sichtbar für alle
    const rows = s.players.map((p, i) => {
      const dsum = (p.seasonMonsters || []).reduce((t, m) => t + (m.danger || 0), 0);
      return `<div class="revrow ${i === s.you ? "me" : ""}"><span>👤 ${esc(p.name)}</span><span class="pts">${dsum} ⚠️</span></div>`;
    }).join("");
    body = `<div class="center" style="color:#fde68a;margin:6px 0 10px">Ein Wurf für alle – der Host würfelt!</div>` + rows;
    btn = s.isHost
      ? `<button class="btn-amber" style="width:100%;margin-top:10px" onclick="dangerRoll()">🎲 Jetzt würfeln!</button>`
      : `<div class="banner wait" style="margin-top:10px;text-align:center">Der Host würfelt für alle – bleibt dran!</div>`;
  } else {
    const rows = d.results.map((r) => {
      const idx = s.players.findIndex((p) => p.name === r.name);
      return `<div class="revrow ${idx === s.you ? "me" : ""}">
        <span>${esc(r.name)}</span>
        <span class="pts">${r.danger}⚠️ · ${r.danger === 0 ? "alles ruhig 😌" : ""}
          ${r.cages ? `👷 ${r.cages} · ` : ""}${r.markers ? `🏹 ${r.markers} · ` : ""}${r.payCoins ? `👑 ${r.payCoins * 3} · ` : ""}${r.newCredits ? `🏦 ${r.newCredits}` : ""}</span>
      </div>`;
    }).join("");
    body = `<div class="center" style="margin:6px 0 10px">Ein Wurf für alle: <b>${d.roll.join(" + ")} = ${d.rollSum} Käfige</b></div>` + rows;
    btn = s.isHost
      ? `<button class="btn-amber" style="width:100%;margin-top:10px" onclick="next()">
          ${s.season >= (s.totalSeasons || 4) - 1 ? "🏁 Zur großen Schlusswertung" : `▶️ Saison ${s.season + 2} starten`}
        </button>`
      : `<div class="banner wait" style="margin-top:10px;text-align:center">Der Host macht weiter – alle schauen gemeinsam!</div>`;
  }
  return `<div class="revwrap" onclick="event.stopPropagation()"><div class="rev">${title}${body}${btn}</div></div>`;
}

function renderReveal(s) {
  const rv = s.reveal;
  // 🔎 v3.0: Der Aufdeck-Schritt kommt vom SERVER (Host klickt für alle) –
  // die alte lokale revealStep-Variable ist weg, kein Spieler kann mehr vorpreschen.
  const revealStep = s.revealStep || 0;
  let body = "";
  const rows = (list, fn) => list.map((p) => {
    const idx = rv.players.indexOf(p);
    return `<div class="revrow ${!p.isBot && idx === s.you ? "me" : ""}">${fn(p)}</div>`;
  }).join("");
  if (revealStep === 0) body = `<p class="center muted" style="margin-bottom:8px">Zuerst: die Menagerien!</p>` +
    rows(rv.players, (p) => `<span>👤 ${esc(p.name)} · ${p.monsterCount} Monster</span><span class="pts">⭐ ${p.monPts}</span>`);
  if (revealStep === 1) body = `<p class="center muted" style="margin-bottom:8px">Trophäen der Saisons (+3 je Trophäe)</p>` +
    rows(rv.players, (p) => `<span>👤 ${esc(p.name)} · 🏆 ${p.trophies}</span><span class="pts">+${p.trophyPts}</span>`);
  if (revealStep === 2) body = `<p class="center" style="color:#fde68a;margin-bottom:8px">🔮 Die geheimen Ziele werden aufgedeckt!</p>` +
    rv.players.map((p, i) => `<div style="margin-bottom:10px">
      <div class="label" style="margin-bottom:4px">👤 ${esc(p.name)}</div>
      ${p.goalResults.length === 0 ? '<span class="muted">keine Ziele</span>' : ""}
      ${p.goalResults.map((gr) => `<div class="revrow" style="background:${gr.pts > 0 ? "rgba(124,58,237,0.25)" : "rgba(255,255,255,0.05)"};opacity:${gr.pts > 0 ? 1 : 0.65}">
        <span><b>${esc(gr.name)}</b> <span class="goal">(${esc(originalGoalText(gr))})</span></span><span class="pts">+${gr.pts}</span></div>`).join("")}
      ${p.goalResults.length ? `<div class="revrow" style="background:rgba(245,158,11,0.2)"><span><b>🎯 Ziele gesamt</b></span><span class="pts"><b>+${p.goalResults.reduce((sum, gr) => sum + gr.pts, 0)}</b></span></div>` : ""}
      </div>`).join("");
  if (revealStep === 3) body = `<p class="center muted" style="margin-bottom:8px">Kronen, Jäger &amp; Kredite (1 👑 = 1 SP · 1 🏹 = 1 SP · Kredit = −5 SP)</p>` +
    rv.players.map((p, i) => `<div class="revrow ${i === s.you ? "me" : ""}">
      <span>👤 ${esc(p.name)}</span>
      <span class="pts">+${p.coinsPts + p.hunterPts} ${p.creditPts ? `<span style="color:#f87171">−${-p.creditPts}</span>` : ""}
        <span class="goal">(👑${p.coins} ×1 · 🏹${p.hunters} ×1 · 🏦${p.credits})</span></span></div>`).join("");
  if (revealStep >= 4) {
    body = `<p class="center" style="color:#fde68a;margin-bottom:8px">Das Endergebnis!</p>` +
      rv.ranked.map((p, i) => `<div class="revrow ${rv.players.indexOf(p) === s.you ? "me" : ""}">
        <span><b>${i === 0 ? "🥇" : i === 1 ? "🥈" : "🥉"} ${esc(p.name)}</b></span><span class="pts">${p.total} SP</span></div>`).join("") +
      `<div class="center" style="margin-top:12px;font-weight:800;color:#fcd34d">🎉 ${esc(rv.ranked[0].name)} wird als neues Mitglied in die Königlich Monstrologische Gesellschaft aufgenommen!</div>` +
      (s.isHost ? `<button class="btn-amber" style="width:100%;margin-top:12px" onclick="rematch()">🔄 Neue Partie im gleichen Raum</button>`
                : `<div class="banner wait" style="margin-top:12px">Der Host kann eine neue Partie starten…</div>`);
  }
  // 🔎 v3.0: Nur der HOST hat den Weiter-Knopf – alle anderen springen mit,
  // wenn der Server den nächsten Schritt ausliefert.
  const nextBtn = revealStep < 4
    ? (s.isHost
        ? `<button class="btn-amber" style="width:100%;margin-top:10px" onclick="revealNext()">▶️ Weiter aufdecken</button>`
        : `<div class="banner wait" style="margin-top:10px;text-align:center">Der Host blättert für alle weiter – gemeinsam Schritt für Schritt!</div>`)
    : "";
  return `<div class="revwrap" onclick="event.stopPropagation()"><div class="rev"><h2>🏁 Die große Schlusswertung</h2>${body}${nextBtn}</div></div>`;
}




// ============================================================
// 🎡 UI-ÜBERNAHME (v2.0): Der Tisch aus dem Prototyp –
// Reichs-Farben, Sitz-Kreis, Lampen, Pfeil-Ring, Kartenfächer,
// runde Eck-Buttons, Aufklapper. Die ganze Spiellogik (Websocket,
// Phasen, Aktionsleiste, Modi) bleibt unverändert.
// ============================================================

const REALM_COLORS = { wald:"#3f9d43", tiefsee:"#3f9ac2", wolken:"#e9c766", hoehlen:"#b07c3f", dunkel:"#94a3b8", traum:"#7c5fb8", gefahr:"#dc2626" };
// v2.7: Belegte Land-Punkte kriegen je Reich eine EIGENE Abdunkel-Farbe statt
// des alten Einheits-Filters: Wolkenlande bleiben sichtbar GELB und sind nicht
// mehr mit den dunklen Höhlenlanden zu verwechseln.
const REALM_OFF_COLORS = { wald:"#2f7a34", tiefsee:"#2b7ea8", wolken:"#c9a12e", hoehlen:"#4a3016", dunkel:"#5c6878", traum:"#584690", gefahr:"#993333" };
const realmColor = (id) => REALM_COLORS[id] || "#8a94a8";
const realmOffColor = (id) => REALM_OFF_COLORS[id] || "#55607a";
const AV_COLORS = ["#3f9ac2", "#3f9d43", "#b07c3f", "#7c5fb8", "#e9c766"];
const AV_DARK = ["#0e2a3d", "#122b18", "#231a3d", "#231a3d", "#2b2410"];

// Zustand der Oberfläche (überlebt den Neuaufbau bei jeder Server-Nachricht)
let inhand = false;          // Karten hochgehoben (Hand-Modus)
let suppressClick = false;   // Wisch-Guard: Wisch nicht als Tipp werten
let openDrawer = null;       // offener Aufklapper: dMen | dLager | dFresh | dChat | dSaison
let drag = null, dragMoved = false;
let fanScroll = 0;           // Fächer-Position überlebt den Neuaufbau
let fanRaf = 0, animId = 0, rubberX = 0;
let fanWinBound = false;

// ---------------------------- Saison-Kopf -------------------------------
function saisonHeadHTML(s) {
  const rc = realmColor(s.seasonCard);
  const emoji = s.seasonCard === "gefahr" ? "🎲" : realmInfo(s.seasonCard).emoji;
  // v3.2-Fix: In GERADE Saisons gehen die Karten zum LINKEN Nachbarn (Spieler
  // me+1 sitzt auf dem Bildschirm links) = im UHRZEIGERSINN um den Tisch. Der
  // Pfeil lief bisher genau verkehrt herum – jetzt zeigt er mit dem Kartenstrom.
  const ccw = s.season % 2 === 1;
  const pool = s.seasonPool || [];
  const reihen = pool.length ? pool : [];
  let lamps = "";
  const cur = s.season;
  if (reihen.length) {
    lamps = reihen.map((rid, i) => {
      if (i < cur) return `<i class="lamp on" style="--lc:${REALM_COLORS[rid] || "#94a3b8"}"></i>`;
      if (i === cur) return `<i class="lamp cur" style="--lc:${REALM_COLORS[rid] || rc}"></i>`;
      return `<i class="lamp"></i>`;
    }).join("");
  } else {
    // Fallback, falls der Server noch keine Saison-Reihenfolge schickt
    let lampen = [];
    for (let i = 0; i < (s.totalSeasons || 4); i++) lampen.push(i === cur ? `<i class="lamp cur" style="--lc:${rc}"></i>` : `<i class="lamp"></i>`);
    lamps = lampen.join("");
  }
  return `<div class="top">
    <div class="sicon ${ccw ? "ccw" : ""}">${emoji}<svg class="pfeil" viewBox="0 0 48 48" width="50" height="50"><path class="bogen" d="M 32.0 4.6 A 21 21 0 1 1 16.0 4.6" style="stroke:${rc}"/><polygon class="spitze" points="14.7,1.4 17.3,7.8 22.5,1.9" style="fill:${rc}"/></svg></div>
    <div class="season"><div class="lamps">${lamps}</div></div>
    <div class="menu" onclick="event.stopPropagation();toggleMenu()">⋮</div>
  </div>`;
}

// ---------------------------- Mitspieler-Panels -------------------------
function statusFor(s, i) {
  const p = s.players[i];
  if (!p.connected && s.phase === "draft") return "📴 Verbindung weg…";
  if (s.phase === "danger") return "🎲 Gefahrenprobe";
  if (s.phase === "reveal") return "🏁 Wertung";
  if (s.phase === "seasonEnd") return (s.seDone || [])[i] ? "✅ fertig" : "📐 spielt noch";
  if (s.mode === "schnell" || s.mode === "langsam") {
    if (s.showTurn >= 0) return s.showTurn === i ? "🔍 deckt gerade auf" : (s.simReady && s.simReady[i] ? "✅" : "⏳");
    return s.simReady && s.simReady[i] ? "✅ hat gewählt" : "⏳ wählt verdeckt…";
  }
  if (s.awaitDiscard === i) return "🗑️ legt offen ab…";
  if (s.turn === i) return "🎯 ist am Zug";
  return "⏳";
}

function spanelHTML(s, pi, links) {
  const p = s.players[pi];
  const free = freeLandsOf(p.lands, p.seasonMonsters);
  const rows = ALL_REALMS.filter((r) => (p.lands[r.id] || 0) > 0).map((r) => {
    const total = p.lands[r.id], occ = total - free[r.id];
    let dots = "";
    for (let k = 0; k < free[r.id]; k++) dots += `<i class="dot on" style="background:${realmColor(r.id)}"></i>`;
    for (let k = 0; k < occ; k++) dots += `<i class="dot off" style="background:${realmOffColor(r.id)}"></i>`;
    return `<div class="lrow">${dots}</div>`;
  }).join("");
  const mons = (p.seasonMonsters || []).map((m) =>
    `<div class="mini" style="--rc:${realmColor(m.realm)}"><div class="me">${m.realm === "traum" ? "🌙" : realmInfo(m.realm).emoji}</div>${esc(m.name)}<div class="st">Lv ${m.cost} · ⭐${m.points}${m.danger ? " ⚠️" + m.danger : ""}</div></div>`).join("");
  const stf = (p.staff || []).map((x) => `<span class="stf" onclick="event.stopPropagation();toggleStaff(${pi},'${esc(x.name)}')">${esc(x.name)}</span>`).join("");
  const detail = staffDetail && staffDetail.pi === pi ? (() => {
    const st = (p.staff || []).find((x) => x.name === staffDetail.name);
    return st ? `<div class="stfdetail"><b>👷 ${esc(st.name)}</b> (−${st.cost} 👑): ${esc(originalCardText({ type: "Mitarbeiter", name: st.name, text: st.text }))}</div>` : "";
  })() : "";
  // v2.5: Anfangsbuchstabe im Avatar – auch bei Bots: „🤖 Name“ zeigt den Buchstaben,
  // nicht das Roboter-Emoji. Vorangestellte Nicht-Buchstaben (Emoji/Leerzeichen)
  // werden abgeschnitten, Array.from arbeitet danach zeichenweise surrogat-sicher.
  const avName = String(p.name || "?").trim().replace(/^[^\p{L}\p{N}]+/u, "").trim();
  const x = ((Array.from(avName)[0]) || "?").toUpperCase();
  return `<div class="spanel${links ? "" : " rechts"}" onclick="event.stopPropagation();this.classList.toggle('auf')">
    <div class="kopf">
      <div class="pav" style="border-color:${AV_COLORS[pi % 5]};background:${AV_DARK[pi % 5]}">${esc(x)}</div>
      <div class="pname">${p.connected ? "" : "📴 "}${esc(p.name)}<small>${statusFor(s, pi)}</small></div>
      <div class="kenn"><span>👑 <b>${p.coins}</b></span><span>🏹 <b>${p.hunters}</b></span><span>💳 <b>${p.credits}</b></span>${p.trophies ? `<span>🏆 <b>${p.trophies}</b></span>` : ""}<i class="pf">▸</i></div>
    </div>
    <div class="landrows">${rows}</div>
    ${mons ? `<div class="minis">${mons}</div>` : ""}
    ${stf ? `<div class="staffbox"><div onclick="event.stopPropagation()">${stf}</div></div>` : ""}
    ${detail}
  </div>`;
}

/* Sitz-Kreis: Gegenüber sitzen oben (schmaler = weiter weg), deine Sitznachbarn
   unten an den Rändern – die Lücke in der Mitte ist dein Platz.
   Von links nach rechts liest man den Karten-Umlauf. */
function spielerBoxHTML(s) {
  const n = s.players.length, me = s.you;
  // v2.5: Sitzplätze bleiben über die Saisons STABIL – kein Platztausch mehr.
  // (Früher: flowLeft = s.season % 2 === 0 → Mitspieler rückten jede Saison um.)
  const flowLeft = true;
  const opp = [];
  for (let k = 1; k < n; k++) opp.push(flowLeft ? (me + k) % n : ((me - k) % n + n) % n);
  const m = opp.length;
  let reihen;
  if (m === 1) reihen = [{ row: "solo", sitze: [[opp[0], true]] }];
  else if (m === 2) reihen = [{ row: "", sitze: [[opp[0], true], [opp[1], false]] }];
  else if (m === 3) reihen = [{ row: "solo", sitze: [[opp[1], true]] }, { row: "unten", sitze: [[opp[0], true], [opp[2], false]] }];
  else reihen = [{ row: "oben", sitze: [[opp[1], true], [opp[2], false]] }, { row: "unten", sitze: [[opp[0], true], [opp[3], false]] }];
  return reihen.map((r) =>
    `<div class="srow ${r.row}">` + r.sitze.map(([pi, links]) => spanelHTML(s, pi, links)).join("") + `</div>`
  ).join("");
}

// ---------------------------- Eigene Länder (Haufen) --------------------
function landsStripHTML(s) {
  const me = s.players[s.you];
  const free = freeLandsOf(me.lands, me.seasonMonsters);
  // v2.4: Tipp auf die eigene Länder-Zeile zeigt die eigenen Saison-Monster
  // (dieselbe Ansicht wie bei den Mitspielern) – nur wenn es etwas zu sehen gibt.
  const hat = (me.seasonMonsters || []).length || (me.staff || []).length;
  return `<div class="landleiste"${hat ? ` onclick="event.stopPropagation();toggleDrawerById('dEigen')"` : ""}>` + ALL_REALMS.filter((r) => (me.lands[r.id] || 0) > 0).map((r) => {
    const total = me.lands[r.id], occ = total - free[r.id];
    const dots = [];
    for (let k = 0; k < free[r.id]; k++) dots.push(true);
    for (let k = 0; k < occ; k++) dots.push(false);
    const hr = (arr) => `<div class="hrow">` + arr.map((f) => `<i class="dot ${f ? "on" : "off"}" style="background:${f ? realmColor(r.id) : realmOffColor(r.id)}"></i>`).join("") + `</div>`;
    if (dots.length <= 2) return `<div class="lcol"><div class="dots">${dots.map((f) => `<i class="dot ${f ? "on" : "off"}" style="background:${f ? realmColor(r.id) : realmOffColor(r.id)}"></i>`).join("")}</div></div>`;
    const unten = Math.ceil(dots.length / 2);
    return `<div class="lcol"><div class="dots">${hr(dots.slice(0, unten))}${hr(dots.slice(unten))}</div></div>`;
  }).join("") + `</div>`;
}

// ---------------------------- Kartenfächer ------------------------------
function fanCardHTML(c, opts) {
  opts = opts || {};
  const ri = realmInfo(c.realm);
  let art = c.realm === "traum" ? "🌙" : ri.emoji, med = "", pts = "", eff = "", zielK = false, rc = realmColor(c.realm);
  if (c.type === "Monster") {
    med = String(c.cost); pts = `⭐${c.points}`;
    if (c.draw) eff += `🃏 zieht ${c.draw} · `;
    if (c.danger) eff += `⚠️${c.danger}`;
  } else if (c.type === "Land") {
    pts = `${c.level} P`;
    if (c.realm !== "traum" && c.level >= 2) eff = "entfernt · Land-Vorbedingung nötig";
  } else if (c.type === "Mitarbeiter") {
    rc = "#0891b2"; art = "👷"; med = String(c.cost); pts = "👑";
    // v2.7: Original-Kartentext als Effekt – mit Client-Fallback, falls der
    // Server (noch) keine Texte schickt.
    eff = originalCardText(c);
  } else if (c.type === "Event") {
    rc = "#ea580c"; art = "🎪";
    // v2.7: Der Event-Effekt – Originaltext mit Client-Fallback.
    eff = originalCardText(c);
  } else {
    rc = "#7c5fb8"; art = "🎯"; zielK = true;
  }
  const sel = opts.selected ? " sel" : "";

function handwrapHTML(s) {

  const canPickHand = s.awaitDiscard === s.you || s.turboDiscard
    || (s.mode === "turbo" && !s.turboDiscard)
    || ((s.mode === "schnell" || s.mode === "langsam") && (!s.mySimPick || window._simEditing) && !freshBusy && s.showTurn < 0);
  const ks = s.hand.map((c) => {
    let onClick = null;
    if (pickDiscard) onClick = `simDiscTap(${c.id})`;
    else if (s.mode === "schnell" || s.mode === "langsam")
      onClick = canPickHand ? ((simSel && c.id === simSel.cardId) ? "simStagedTap()" : `fanSel(${c.id})`) : null;
    else onClick = canPickHand ? `fanSel(${c.id})` : null;
    const isSel = (selected && selected.id === c.id) || (simSel && c.id === simSel.cardId) || (!!simDiscard && c.id === simDiscard);

}

const phoneOf = () => document.getElementById("phone");
const handOf = () => document.getElementById("hand");
function karten() { const h = handOf(); return h ? Array.prototype.slice.call(h.querySelectorAll(".k")) : []; }

function updateFan() {
  const hand = handOf();
  if (!hand) return;
  const ks = hand.querySelectorAll(".k");
  if (!ks.length) return;
  const w = hand.clientWidth, mid = hand.scrollLeft + w / 2;
  ks.forEach(function (el) {
    const c = el.offsetLeft + el.offsetWidth / 2;
    const d = Math.abs((c - mid) / el.offsetWidth);
    const a = Math.min(d, 2.6);
    const s = 1 - .26 * a;
    const ty = a * a * 7 + (el.classList.contains("sel") ? -12 : 0);
    el.style.transform = "translateY(" + ty + "px) scale(" + s + ")";
    el.style.zIndex = String(100 - Math.round(d * 20));
    el.style.opacity = String(Math.max(.25, 1 - d * .22));
    if (el.classList.contains("sel")) el.style.boxShadow = "0 0 0 3px var(--gold), 0 12px 28px #000c";
    else el.style.boxShadow = "";
  });
}

function cardZiel(hand, el) { return el.offsetLeft - (hand.clientWidth - el.offsetWidth) / 2; }

function animiere(ziel) {
  const hand = handOf();
  if (!hand) return;
  cancelAnimationFrame(animId);
  const von = hand.scrollLeft, dist = ziel - von;
  if (Math.abs(dist) < 1) { hand.scrollLeft = ziel; updateFan(); return; }
  const dauer = Math.max(200, Math.min(480, 170 + Math.abs(dist) * .85));
  const t0 = performance.now();
  function frame(t) {
    const p = Math.min(1, (t - t0) / dauer);
    hand.scrollLeft = von + dist * (1 - Math.pow(1 - p, 3));
    updateFan();
    if (p < 1 && handOf() === hand) animId = requestAnimationFrame(frame);
  }
  animId = requestAnimationFrame(frame);
}

function centerCard(el) {
  const hand = handOf();
  if (hand && el) animiere(cardZiel(hand, el));
}

function fanFollow(ms) {
  const st = Date.now();
  const iv = setInterval(function () {
    updateFan();
    if (Date.now() - st > ms) clearInterval(iv);
  }, 40);
}

function handModus(an, focusEl) {
  inhand = an;
  const ph = phoneOf();
  if (!ph) return;
  ph.classList.toggle("inhand", an);
  if (an) {
    const f = focusEl || karten()[0];
    if (f) centerCard(f);
    const f2 = f;
    if (f2) setTimeout(function () { if (inhand) { const noch = document.querySelector('.k[data-fid="' + (f2.dataset ? f2.dataset.fid : "") + '"]'); if (noch) centerCard(noch); } }, 430);
    renderActionBar(); // v2.1: Band darf beim Anheben wiederkommen (z. B. „✏️ Ändern“)
  } else {
    // v2.1: Karten abgelegt -> gewaehlte Handkarte abwaehlen, Infozeile leeren,
    // Band neu berechnen (verschwindet - ausser z. B. „Fertig“ im Saisonende).
    if (selected && selectedFrom === "hand") { selected = null; selectedFrom = null; window._realm = null; }
    // Gold-Rahmen der zuletzt gewaehlten Karte entfernen (kein render() hier)
    karten().forEach(function (el) { el.classList.remove("sel"); });
    const info = document.getElementById("info");
    if (info) info.textContent = "";
    if (state) renderActionBar();
  }
  fanFollow(500);
}

window.fanSel = (id) => {
  if (suppressClick) return;
  // v2.1: Erster Tipp auf die halb sichtbaren Karten hebt NUR an - gewaehlt wird,
  // wenn der Faecher schon oben ist. Noch mal auf die gewaehlte Karte tippen = abwaehlen.
  if (!inhand) { handModus(true); return; }
  if (selected && selected.id === id) { selected = null; selectedFrom = null; window._realm = null; render(); return; }
  selected = (state.hand || []).find((c) => c.id === id) || null;
  selectedFrom = "hand";
  window._realm = null;
  render();
  if (selected) {
    const el = document.querySelector('.k[data-fid="' + id + '"]');
    handModus(true, el);
    const info = document.getElementById("info");
    if (info && el && el.dataset.info) info.textContent = el.dataset.info;
  }
};

// Auswahl ersetzt die alte Funktion: nach dem Neuaufbau die Karte zentrieren
// v2.1: Noch mal auf die gewaehlte Karte tippen = abwaehlen (Band verschwindet).
window.selectCard = (id, from) => {
  const src = from === "hand" ? state.hand : state.stored;
  if (selected && selected.id === id && selectedFrom === from) { selected = null; selectedFrom = null; window._realm = null; render(); return; }
  selected = src.find((c) => c.id === id) || null;
  selectedFrom = from;
  window._realm = null;
  // v2.6: Der Lager-Drawer bleibt bei der Kartenwahl OFFEN (rutscht über das Band).
  // v2.5-Lösung (Auto-Schließen) verworfen: Damit verschwand der Kasten komplett.
  render();
  if (from === "hand" && selected) {
    const el = document.querySelector('.k[data-fid="' + id + '"]');
    handModus(true, el);
  }
};

// Wischen: 1:1 am Finger, Trägheit, Gummi an den Enden (wie Prototyp)
function onFanMove(e) {
  if (!drag) return;
  const hand = handOf();
  if (!hand) { drag = null; return; }
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 8) dragMoved = true;
  const jetzt = Date.now();
  drag.samples.push({ t: jetzt, x: e.clientX });
  while (drag.samples.length > 2 && jetzt - drag.samples[0].t > 120) drag.samples.shift();
  const min = 0, max = hand.scrollWidth - hand.clientWidth;
  let ziel = drag.sl - dx;
  if (ziel < min) { hand.scrollLeft = min; rubberX = ziel * .3; }
  else if (ziel > max) { hand.scrollLeft = max; rubberX = (ziel - max) * .3; }
  else { hand.scrollLeft = ziel; rubberX = 0; }
  const hin = document.getElementById("handin");
  if (hin) hin.style.transform = rubberX ? "translateX(" + rubberX.toFixed(1) + "px)" : "";
}
function onFanUp() {
  if (!drag) return;
  const hand = handOf();
  const s = drag.samples; drag = null;
  if (!hand) return;
  if (rubberX) {
    const start = rubberX, t0 = performance.now();
    rubberX = 0;
    (function fr(t) {
      const p = Math.min(1, (t - t0) / 220);
      const hin = document.getElementById("handin");
      if (hin) hin.style.transform = p < 1 ? "translateX(" + (start * (1 - p * p)) + "px)" : "";
      if (p < 1) requestAnimationFrame(fr);
    })(t0);
  }
  let v = 0;
  if (s.length > 1 && s[s.length - 1].t > s[0].t) v = (s[s.length - 1].x - s[0].x) / (s[s.length - 1].t - s[0].t);
  let vorhersage = hand.scrollLeft - v * 240;
  const ks = karten();
  let best = 0, bd = 1e9;
  ks.forEach(function (c, i) {
    const d = Math.abs(cardZiel(hand, c) - vorhersage);
    if (d < bd) { bd = d; best = i; }
  });
  if (Math.abs(v) > .55) best = Math.max(0, Math.min(ks.length - 1, best + (v < 0 ? 1 : -1)));
  if (ks[best]) animiere(cardZiel(hand, ks[best]));
  if (dragMoved) { suppressClick = true; setTimeout(function () { suppressClick = false; }, 90); }
}

// Tipp außerhalb: legt Karten ab / schließt Aufklapper + Menü
function outsideTap(e) {
  const t = e.target;
  if (!t || !t.closest) return;
  // v2.7: Wurde das angetippte Element durch render() bereits ERSETZT (z. B.
  // Reich-Wahl beim gezogenen Entdecker: chooseFreshRealm ruft render()), ist
  // der Tipp ein Tipp auf die ALTE Oberfläche – die NEUE darf nicht als
  // „Tipp außerhalb“ werten und den Aufklapper schließen. Genau deshalb
  // verschwand der Kasten beim Wählen des Landes!
  if (!t.isConnected) return;
  const drawerWasOpen = !!document.querySelector(".drawer.open");
  if (!t.closest(".drawer") && !t.closest(".corner") && !t.closest(".midst")) closeDrawersNow();
  if (!t.closest(".optionen") && !t.closest(".menu")) closeMenu();
  if (inhand && !suppressClick && !drawerWasOpen
    && !t.closest(".k") && !t.closest("#actionbar") && !t.closest(".uiband")
    && !t.closest(".bottombar") && !t.closest(".optionen") && !t.closest(".menu")
    && !t.closest(".spanel") && !t.closest(".landleiste")) handModus(false);
}

function bindFan() {
  const hand = handOf();
  if (!hand) return;
  hand.scrollLeft = fanScroll;
  hand.addEventListener("scroll", function () {
    fanScroll = hand.scrollLeft;
    if (!fanRaf) fanRaf = requestAnimationFrame(function () { fanRaf = 0; updateFan(); });
  });
  document.querySelectorAll(".k").forEach(function (el) {
    // v2.7: Die großen Zieh-Karten im Draco liegen im Drawer – ein Wisch darüber
    // darf den Kartenfächer darunter NICHT verschieben.
    if (el.closest(".drawer")) return;
    el.addEventListener("pointerdown", function (e) {
      cancelAnimationFrame(animId);
      drag = { x: e.clientX, sl: hand.scrollLeft, samples: [{ t: Date.now(), x: e.clientX }] };
      dragMoved = false;
    });
  });
  if (!fanWinBound) {
    fanWinBound = true;
    window.addEventListener("pointermove", onFanMove);
    window.addEventListener("pointerup", onFanUp);
    window.addEventListener("pointercancel", function () { drag = null; });
    window.addEventListener("resize", updateFan);
    document.addEventListener("click", outsideTap);
  }
  updateFan();
  fanFollow(500);
}
