    <h4>${s.seasonCard === "gefahr" ? "🎲" : realmInfo(s.seasonCard).emoji} Saison ${s.season + 1} von ${s.totalSeasons || 4}: ${esc(s.seasonName)}</h4>
    <p style="font-size:.8rem;margin:0 0 8px">${esc(s.seasonHint)}</p>
    <p class="muted" style="margin:0 0 6px">Trophäe (+3 SP) für die ${s.seasonCard === "gefahr" ? "meisten ⚠️" : "meisten ⭐"} in dieser Saison · 1 übrig gebliebene Krone = 1 SP · 1 Jägermarker = 1 SP</p>
    ${s.bonusGiven ? '<p class="muted" style="margin:0 0 6px">2-Kronen-Bonus bereits kassiert.</p>' : ""}
    ${s.players.length === 2 && s.phase === "draft" ? `<p class="muted" style="margin:0 0 6px">🗑️ 2er-Regeln: offene Ablage · Nachziehstapel: ${s.stackCount || 0} Karten verdeckt</p>` : ""}
    <p class="muted" style="margin:0">${modeTxt}</p></div>`;
}

function bottombarHTML(s) {
  const me = s.players[s.you];
  const lagN = (s.stored || []).length + (s.goals || []).length;
  const mengN = (s.menagerie || []).length;
  // v2.7: Solange Gratis-Ziehungen offen sind, gibt es einen eigenen 🃏-Knopf –
  // der Zieh-Kasten kann damit IMMER wieder geöffnet werden.
  const freshN = (s.freshDraw || []).filter((c) => c.type !== "Ziel").length;
  return `<div class="bottombar">
    <button class="corner" id="cMen" onclick="event.stopPropagation();toggleDrawerById('dMen')"><span class="emoji">🎭</span>${mengN ? `<span class="badge">${mengN}</span>` : ""}</button>
    ${freshN ? `<button class="corner hot" id="cFresh" onclick="event.stopPropagation();toggleDrawerById('dFresh')"><span class="emoji">🃏</span><span class="badge">${freshN}</span></button>` : ""}
    <div class="midst" onclick="event.stopPropagation()">
      <span>👑 <b>${me.coins}</b></span><span class="sep">·</span>
      <span>🏹 <b>${me.hunters}</b></span><span class="sep">·</span>
      <span>💳 <b>${me.credits}</b></span>${me.trophies ? `<span class="sep">·</span><span>🏆 <b>${me.trophies}</b></span>` : ""}
    </div>
    <button class="corner" id="cLager" onclick="event.stopPropagation();toggleDrawerById('dLager')"><span class="emoji">📥</span>${lagN ? `<span class="badge">${lagN}</span>` : ""}</button>
  </div>`;
}

function menuHTML(s) {
  return `<div class="optionen" id="optmenu">
    <button class="optitem" onclick="closeMenu();toggleDrawerById('dSaison')">ℹ️ <span>Saison-Info & Spieltempo</span></button>
    <button class="optitem" onclick="closeMenu();toggleDrawerById('dChat')">💬 <span>Spielverlauf & Chat</span></button>
    ${s.isHost && (s.phase === "draft" || s.phase === "seasonEnd" || s.phase === "danger")
      ? `<button class="optitem" onclick="closeMenu();newGame()">🔄 <span>Neue Partie (zur Lobby)</span></button>` : ""}
    <button class="optitem" onclick="closeMenu();leaveRoom()">🚪 <span>Raum ${s.isHost ? "schließen" : "verlassen"}</span></button>
  </div>`;
}

// ---------------------------- Wechsel-Schirme & 2er-Infos ---------------
function mitteHTML(s) {
  let html = turnBanner(s);
  if (s.phase === "draft" && s.players.length === 2) {
    const chips = (s.openDiscards || []).map((d) =>
      `<span class="chip" style="background:rgba(249,115,22,0.18);color:#fdba74">${esc(s.players[d.by].name)}: ${esc(d.card.name)}${d.card.type === "Monster" ? " ⭐" + d.card.points : d.card.type === "Land" ? " +" + d.card.level : ""}</span>`).join("");
    html += `<div class="card-panel"><div class="label">🗑️ Offene Ablage · Nachziehstapel: ${s.stackCount || 0} Karten verdeckt</div>
      <div class="chips">${chips || '<span class="muted">Noch nichts offen abgelegt.</span>'}</div></div>`;
  }
  if (s.phase === "draft" && s.mode === "langsam" && s.players.length === 2 && !s.hand.length && s.awaitDiscard !== s.you) {
    const other = s.players[1 - s.you];
    html += `<div class="card-panel"><div class="label">⏳ Deine neue Hand kommt gleich…</div>
      <p class="muted center">${esc(other.name)} wählt gerade eine Karte und legt offen ab.<br/>Erst danach siehst du den übergebenen Stapel – vorher weiß niemand, was reinkommt.</p></div>`;
  }
  if (s.phase === "draft" && s.mode === "turbo" && !s.hand.length && !s.turboDiscard) {
    html += `<div class="card-panel"><div class="label">⏳ Neue Karten kommen gleich…</div><p class="muted center">Die anderen spielen noch – sobald ein Stapel bei dir ankommt, geht es für dich weiter.</p></div>`;
  }
  // 🪶 v3.4: Am Saisonende KEIN Extra-Kasten mehr – das Banner oben und der
  // „Fertig“-Knopf im Aktionsband genügen (Nutzer-Wunsch: deutlich weniger Text).
  if (s.phase === "danger") html += renderDanger(s);
  if (s.phase === "reveal") html += renderReveal(s);
  return html;
}

// ---------------------------- Der Spieltisch ----------------------------
function phoneShellHTML(s) {
  if ((s.freshDraw || []).some((c) => c.type !== "Ziel")) openDrawer = "dFresh";
  if (!(s.phase === "draft" && s.hand && s.hand.length)) inhand = false;
  return `<div class="phone${inhand ? " inhand" : ""}" id="phone">`
    + saisonHeadHTML(s)
    + `<div class="spieler" id="spielerBox">${spielerBoxHTML(s)}</div>`
    + `<div class="mitte">${mitteHTML(s)}</div>`
    + `<div class="uiband"><div class="info" id="info"></div></div>`
    + handwrapHTML(s)
    + landsStripHTML(s)
    + drawerMenHTML(s)
    + drawerLagerHTML(s)
    + drawerEigenHTML(s)
    + drawerFreshHTML(s)
    + drawerChatHTML(s)
    + drawerSaisonHTML(s)
    + bottombarHTML(s)
    + menuHTML(s)
    + `</div>`;
}

function render() {
  if (!state) { renderConnect(); return; }
  if (state.phase === "lobby") { actionBar.style.display = "none"; renderLobby(state); return; }
  // v2.8: Geister-Wahl abscheiden. Der Server führt ⚡-Runden sofort aus, sobald
  // ALLE gewählt haben (Bots tippen blitzschnell), rotiert die Hände und setzt
  // die Wahl zurück. Der Client zeigte aber die gestufte Wahl („✅ Fertig!“ /
  // „✏️ Ändern“) einfach WEITER an – für eine Karte, die gar nicht mehr auf der
  // Hand liegt. Klick darauf lief ins Leere bzw. der Server antwortete mit
  // „Karte nicht gefunden“. Merkregel: Liegt die gestufte/gewählte Karte nicht
  // mehr auf der Hand, ist die Runde längst ausgeführt -> Zustand zurücksetzen
  // statt toter Buttons. (Vor dem Server-Echo ist das sicher: die Karte verlässt
  // die Hand NUR durch die eigene, bereits abgeschickte Wahl.)
  if (state.phase === "draft" && Array.isArray(state.hand)) {
    if (simSel && !state.hand.some((c) => c.id === simSel.cardId)) { simSel = null; simDiscard = null; window._simSent = false; }
    else if (simDiscard != null && !state.hand.some((c) => c.id === simDiscard)) simDiscard = null;
    if (selected && selectedFrom === "hand" && !state.hand.some((c) => c.id === selected.id)) {
      selected = null; selectedFrom = null; window._realm = null;
    }
  }
  app.innerHTML = phoneShellHTML(state);
  renderActionBar();
  bindFan();
  if (state.phase !== "draft" && state.phase !== "seasonEnd") { selected = null; }
}

window.addEventListener("load", connect);
</script>
</body>
</html>
